<script>
/*
 * Core: shared state, site config, campus-data load and cache, floor-SVG cache, lookups, toast.
 * Data contract v2 (plan mscn-v2-build); reads go through MSCNData (WebApp_Data), the static files the
 * build publishes next to the page. ES5 syntax.
 */
var APP = {
  data: null,
  version: null,
  stale: false,
  view: 'map',
  appUrl: '',
  site: null,
  graph: null,
  searchIndex: null,
  by: { buildings: {}, floors: {}, rooms: {}, nodes: {} },
  floorsByBuilding: {},
  roomsByFloor: {}
};

var LS_KEYS = {
  data: 'campusData',
  version: 'campusDataVersion',
  siteConfig: 'mscnSiteConfig',
  officialPrefix: 'mscnOfficialSchedule:',
  svgPrefix: 'mscnFloorSvg:',
  schedule: 'campusNavSchedule',
  avoidStairs: 'mscnAvoidStairs',
  useSideDoors: 'mscnUseSideDoors',
  lastBuilding: 'mscnLastBuilding'
};

function $(id) { return document.getElementById(id); }

function lsGet(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function lsRemove(key) {
  try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
}

function escapeHtml(str) {
  if (str === null || str === undefined) { return ''; }
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function isArray(v) { return Object.prototype.toString.call(v) === '[object Array]'; }

function parseJsonField(v, dflt) {
  if (v === null || v === undefined || v === '') { return dflt; }
  if (typeof v !== 'string') { return v; }
  try { return JSON.parse(v); } catch (e) { return dflt; }
}

var ICONS = {
  close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
  navigate: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.71 11.29l-9-9a.996.996 0 00-1.41 0l-9 9a.996.996 0 000 1.41l9 9c.39.39 1.02.39 1.41 0l9-9a.996.996 0 000-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>',
  walk: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>',
  start: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>',
  info: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>',
  building: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>'
};

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg, kind, ms) {
  var t = $('toast');
  if (!t) { return; }
  t.textContent = msg;
  t.className = kind ? 'is-' + kind : '';
  t.hidden = false;
  if (toastTimer) { clearTimeout(toastTimer); }
  toastTimer = setTimeout(function () { t.hidden = true; }, ms || 3800);
}
function showError(msg) { toast(msg, 'error', 5000); }

/* ---------- site config (config.json; cached so an offline start keeps its settings) ---------- */

function loadSiteConfig() {
  MSCNData.getConfig(function (err, raw) {
    var cfg;
    if (!err && raw && typeof raw === 'object') {
      cfg = MSCNData.normalizeConfig(raw);
      lsSet(LS_KEYS.siteConfig, JSON.stringify(cfg));
    } else {
      cfg = MSCNData.normalizeConfig(parseJsonField(lsGet(LS_KEYS.siteConfig), {}));
    }
    APP.site = cfg;
    MSCNAnalytics.init(cfg.analytics);
  });
}

function errText(err) {
  if (!err) { return 'Unknown error'; }
  return err.message ? err.message : String(err);
}

/* ---------- lookups ---------- */
function isPublicFloor(f) { return !!f && MSCNPath.toBool(f.public, true); }

function getConfigValue(key) {
  var cfg = (APP.data && APP.data.config) || [];
  for (var i = 0; i < cfg.length; i++) { if (cfg[i] && cfg[i].key === key) { return cfg[i].value; } }
  return null;
}

function indexData(data) {
  var by = { buildings: {}, floors: {}, rooms: {}, nodes: {} };
  var floorsByBuilding = {};
  var roomsByFloor = {};
  var i;
  var b = data.buildings || [];
  for (i = 0; i < b.length; i++) {
    if (!b[i] || !b[i].id) { continue; }
    b[i].entrances = parseJsonField(b[i].entrances, []);
    if (!isArray(b[i].entrances)) { b[i].entrances = []; }
    by.buildings[b[i].id] = b[i];
  }
  var f = data.floors || [];
  for (i = 0; i < f.length; i++) {
    if (!f[i] || !f[i].id) { continue; }
    by.floors[f[i].id] = f[i];
    if (!isPublicFloor(f[i])) { continue; }
    if (!floorsByBuilding[f[i].buildingId]) { floorsByBuilding[f[i].buildingId] = []; }
    floorsByBuilding[f[i].buildingId].push(f[i]);
  }
  for (var bid in floorsByBuilding) {
    if (floorsByBuilding.hasOwnProperty(bid)) {
      floorsByBuilding[bid].sort(function (x, y) { return Number(x.level) - Number(y.level); });
    }
  }
  var r = data.rooms || [];
  for (i = 0; i < r.length; i++) {
    if (!r[i] || !r[i].id) { continue; }
    r[i].polygon = parseJsonField(r[i].polygon, null);
    r[i].shortLabel = MSCNSearch.displayNumber(r[i].number) || '';
    by.rooms[r[i].id] = r[i];
    if (!roomsByFloor[r[i].floorId]) { roomsByFloor[r[i].floorId] = []; }
    roomsByFloor[r[i].floorId].push(r[i]);
  }
  var n = data.navNodes || [];
  for (i = 0; i < n.length; i++) { if (n[i] && n[i].id) { by.nodes[n[i].id] = n[i]; } }

  APP.by = by;
  APP.floorsByBuilding = floorsByBuilding;
  APP.roomsByFloor = roomsByFloor;
  APP.graph = MSCNPath.buildGraph(data, { floorFilter: isPublicFloor });
  APP.searchIndex = MSCNSearch.buildIndex(data, { floorFilter: isPublicFloor });
}

function buildingHasIndoor(b) {
  if (!b) { return false; }
  var flag = MSCNPath.toBool(b.hasIndoor, null);
  var floors = APP.floorsByBuilding[b.id] || [];
  if (flag === false) { return false; }
  return floors.length > 0;
}

function indoorBuildings() {
  var out = [];
  var list = (APP.data && APP.data.buildings) || [];
  for (var i = 0; i < list.length; i++) { if (buildingHasIndoor(list[i])) { out.push(list[i]); } }
  return out;
}

function floorLabel(floorId) {
  var f = APP.by.floors[floorId];
  if (!f) { return 'another floor'; }
  return f.label || ('Floor ' + f.level);
}

function buildingOfFloor(floorId) {
  var f = APP.by.floors[floorId];
  return f ? APP.by.buildings[f.buildingId] || null : null;
}

function buildingName(buildingId) {
  var b = APP.by.buildings[buildingId];
  return b ? (b.name || b.id) : String(buildingId || '');
}

function roomTitle(room) {
  if (!room) { return ''; }
  var b = buildingOfFloor(room.floorId);
  var num = MSCNSearch.displayNumber(room.number) || room.id;
  return (b && b.code ? b.code + ' ' : '') + num;
}

/* data-room-id in the SVG -> canonical room id. Accepts the full id, the CAD number, or the display number. */
function resolveRoomRef(raw, floorId) {
  if (raw === null || raw === undefined || raw === '') { return null; }
  raw = String(raw);
  if (APP.by.rooms[raw]) { return raw; }
  var f = APP.by.floors[floorId];
  if (f) {
    var b = APP.by.buildings[f.buildingId];
    var short = b ? String(b.id).replace(/^bld-/, '') : '';
    var guess = 'room-' + short + '-' + f.level + '-' + raw;
    if (APP.by.rooms[guess]) { return guess; }
  }
  var want = MSCNSearch.displayNumber(raw);
  var list = APP.roomsByFloor[floorId] || [];
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].number) === raw || MSCNSearch.displayNumber(list[i].number) === want) { return list[i].id; }
  }
  return null;
}

function isAppleDevice() {
  var ua = String((window.navigator && navigator.userAgent) || '');
  return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
}

/*
 * "Directions to campus": the visitor's own maps app, to a door's coordinates (decision
 * mscn-v4-gps-offline-and-google-as-exit-only). Apple Maps on iPhone and iPad, Google Maps elsewhere. This is the only
 * place the app hands off to an outside map; walking on campus is our own map.
 */
function directionsToCampusUrl(lat, lng) {
  var ll = Number(lat) + ',' + Number(lng);
  if (isAppleDevice()) { return 'https://maps.apple.com/?daddr=' + encodeURIComponent(ll); }
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(ll);
}

function entranceLabel(e) { return (e && (e.label || e.name)) || ''; }

/* Best outdoor target for a building: the given entrance node, a primary door, any mapped entrance, the building point. */
function buildingTarget(buildingId, nodeId) {
  var b = APP.by.buildings[buildingId];
  if (!b) { return null; }
  var g = APP.graph;
  var n = nodeId && g ? g.nodes[nodeId] : null;
  if (n && MSCNPath.hasLngLat(n)) { return { lat: n.lat, lng: n.lng, name: doorName(n, buildingId), nodeId: n.id }; }
  var prim = g ? MSCNPath.primaryEntrances(g, buildingId) : [];
  if (prim.length) { n = g.nodes[prim[0]]; return { lat: n.lat, lng: n.lng, name: doorName(n, buildingId), nodeId: n.id }; }
  var ents = b.entrances || [];
  var i;
  for (i = 0; i < ents.length; i++) {
    if (nodeId && ents[i].nodeId === nodeId && ents[i].lat && ents[i].lng) { return { lat: ents[i].lat, lng: ents[i].lng, name: entranceLabel(ents[i]) || 'entrance' }; }
  }
  for (i = 0; i < ents.length; i++) {
    if (ents[i].lat && ents[i].lng && MSCNPath.accessOf(ents[i]) === 'main') { return { lat: ents[i].lat, lng: ents[i].lng, name: entranceLabel(ents[i]) || 'entrance' }; }
  }
  for (i = 0; i < ents.length; i++) {
    if (ents[i].lat && ents[i].lng && MSCNPath.accessOf(ents[i]) !== 'emergency') { return { lat: ents[i].lat, lng: ents[i].lng, name: entranceLabel(ents[i]) || 'entrance' }; }
  }
  if (b.lat && b.lng) { return { lat: b.lat, lng: b.lng, name: b.name }; }
  return null;
}

/* What a door is called in step text: its label (admin or data), else its side of the building ("east entrance"). */
function doorName(node, buildingId) {
  if (!node) { return 'entrance'; }
  var b = APP.by.buildings[buildingId || ''] || null;
  var ents = (b && b.entrances) || [];
  for (var i = 0; i < ents.length; i++) { if (ents[i].nodeId === node.id && entranceLabel(ents[i])) { return entranceLabel(ents[i]); } }
  if (node.label) { return String(node.label); }
  var c = buildingCenter(buildingId);
  if (c && MSCNPath.hasLngLat(node) && MSCNGeo.haversine(c, node) > 4) {
    return MSCNGeo.compass(MSCNGeo.bearing(c, node)) + ' entrance';
  }
  return 'entrance';
}

/* A building's center: its map footprint when the map has loaded one, else the seeded point. */
function buildingCenter(buildingId) {
  var fp = window.MAPV && MAPV.centers ? MAPV.centers[buildingId] : null;
  if (fp) { return fp; }
  var b = APP.by.buildings[buildingId || ''];
  if (b && b.lat && b.lng && isFinite(Number(b.lat)) && Number(b.lat) !== 0) { return { lat: Number(b.lat), lng: Number(b.lng) }; }
  return null;
}

/* ---------- campus data load (cache + version check + offline fallback) ---------- */
function readCachedData() {
  var raw = lsGet(LS_KEYS.data);
  var ver = lsGet(LS_KEYS.version);
  if (!raw || ver === null) { return null; }
  try { return { data: JSON.parse(raw), version: ver }; } catch (e) { return null; }
}

function clearSvgCache(exceptKey) {
  try {
    var keys = [];
    for (var i = 0; i < window.localStorage.length; i++) {
      var k = window.localStorage.key(i);
      if (k && k.indexOf(LS_KEYS.svgPrefix) === 0 && k !== exceptKey) { keys.push(k); }
    }
    for (var j = 0; j < keys.length; j++) { lsRemove(keys[j]); }
  } catch (e) { /* storage unavailable */ }
}

function writeCachedData(data, version) {
  var json = JSON.stringify(data);
  if (!lsSet(LS_KEYS.data, json)) {
    clearSvgCache(null);
    if (!lsSet(LS_KEYS.data, json)) { return; }
  }
  lsSet(LS_KEYS.version, String(version));
}

function setLoadingStatus(text) {
  var e = $('loading-status');
  if (e) { e.textContent = text; }
}

function showFatal(msg) {
  var s = $('loading-screen');
  s.className = 'is-error';
  setLoadingStatus(msg);
  var btn = $('loading-retry');
  btn.onclick = function () {
    s.className = '';
    setLoadingStatus('Loading campus data…');
    loadCampusData(APP.onReady);
  };
  btn.focus();
}

function loadCampusData(onReady) {
  APP.onReady = onReady;
  var cached = readCachedData();
  setLoadingStatus(cached ? 'Checking for updates…' : 'Downloading campus data…');
  MSCNData.getVersion(function (err, info) {
    var remote = (!err && info && info.version !== undefined) ? info.version : null;
    var plan = MSCNData.planLoad(cached, remote, !!err);
    if (plan === 'fetch' && cached && typeof checkForUpdate === 'function') { checkForUpdate(); }
    if (plan === 'cache') { onReady(cached.data, cached.version, false); }
    else if (plan === 'stale') { onReady(cached.data, cached.version, true); }
    else { fetchFreshData(cached, remote, onReady); }
  });
}

function fetchFreshData(fallback, remoteVersion, onReady) {
  setLoadingStatus('Downloading campus data…');
  MSCNData.getCampus(remoteVersion, function (err, result) {
    var ok = !err && MSCNData.looksLikeCampus(result);
    if (ok && MSCNData.isVersion(remoteVersion, result)) {
      var version = MSCNData.versionOf(remoteVersion, result);
      writeCachedData(result, version);
      onReady(result, version, false);
    } else if (fallback) {
      /* failed, or a payload other than the advertised version: keep the saved copy (never relabel a payload) */
      onReady(fallback.data, fallback.version, true);
    } else if (ok) {
      /* no saved copy: show what came back under its own version, uncached, as not current */
      onReady(result, MSCNData.versionOf(null, result), true);
    } else if (!err) {
      showFatal('The campus data came back empty. Please try again in a moment.');
    } else {
      showFatal('Could not load campus data (' + errText(err) + '). Check your connection and try again.');
    }
  });
}

/* ---------- floor plan SVG (memory + localStorage keyed by data version) ---------- */
var svgMemory = {};

function getFloorSvg(floorId, cb) {
  var key = LS_KEYS.svgPrefix + floorId;
  var ver = String(APP.version);
  if (svgMemory[floorId] && svgMemory[floorId].v === ver) { cb(null, svgMemory[floorId].svg, { source: 'memory' }); return; }
  var cached = parseJsonField(lsGet(key), null);
  if (cached && cached.v === ver && cached.svg) {
    svgMemory[floorId] = cached;
    cb(null, cached.svg, { source: 'cache' });
    return;
  }
  MSCNData.getFloorSvg(floorId, APP.version, function (err, svg) {
    if (err) { fallbackOrFail(err); return; }
    if (!MSCNData.looksLikeSvg(svg)) {
      fallbackOrFail(new Error('No floor plan was published for this floor.'));
      return;
    }
    var entry = { v: ver, svg: svg };
    svgMemory[floorId] = entry;
    var json = JSON.stringify(entry);
    if (!lsSet(key, json)) {
      clearSvgCache(key);
      lsSet(key, json);
    }
    cb(null, svg, { source: 'server' });
  });

  function fallbackOrFail(err) {
    if (cached && cached.svg) {
      cb(null, cached.svg, { source: 'stale-cache' });
    } else {
      cb(err || new Error('Floor plan unavailable'), null, null);
    }
  }
}

/* A plain plan drawn from Rooms.polygon, used when the floor's SVG asset cannot be loaded. */
function synthesizeFloorSvg(floorId) {
  var f = APP.by.floors[floorId];
  var rooms = APP.roomsByFloor[floorId] || [];
  var parts = [];
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < rooms.length; i++) {
    var poly = rooms[i].polygon;
    if (!isArray(poly) || poly.length < 3) { continue; }
    var d = [];
    for (var k = 0; k < poly.length; k++) {
      var x = Number(poly[k][0]);
      var y = Number(poly[k][1]);
      if (x < x0) { x0 = x; } if (y < y0) { y0 = y; }
      if (x > x1) { x1 = x; } if (y > y1) { y1 = y; }
      d.push((k === 0 ? 'M' : 'L') + x + ' ' + y);
    }
    parts.push('<path data-room-id="' + escapeHtml(rooms[i].id) + '" d="' + d.join(' ') + ' Z"/>');
  }
  if (!parts.length) { return null; }
  var w = Number(f && f.widthPx) || (x1 + Math.max(0, x0));
  var h = Number(f && f.heightPx) || (y1 + Math.max(0, y0));
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '"><g id="rooms">' + parts.join('') + '</g></svg>';
}
</script>
