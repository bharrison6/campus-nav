<script>
/*
 * Main: tabs, the persistent search box, keyboard handling, the service worker, and the boot sequence. ES5.
 */
var VIEWS = ['map', 'indoor', 'schedule', 'scan'];

function switchToView(name) {
  if (VIEWS.indexOf(name) === -1) { return; }
  var prev = APP.view;
  for (var i = 0; i < VIEWS.length; i++) {
    var v = VIEWS[i];
    var on = v === name;
    var panel = $('view-' + v);
    panel.className = 'view' + (on ? ' is-active' : '');
    panel.hidden = !on;
    var tab = $('tab-' + v);
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
  }
  APP.view = name;
  if (prev === 'scan' && name !== 'scan') { stopScan(); }
  if (name !== 'map') { closeBuildingSheet(); }
  /* The route panel is shared by the map and the floor plan. */
  $('route-panel').hidden = !NAV.route || (name !== 'map' && name !== 'indoor');
  if (name === 'map' && window.MAPV) { MAPV.onShow(); }
  if (name === 'indoor') { indoorOnShow(); }
  if (name === 'schedule') { renderSchedule(); }
}

function initTabs() {
  var tabs = document.querySelectorAll('.tabbar [role="tab"]');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function (e) { switchToView(e.currentTarget.getAttribute('data-view')); };
    tabs[i].onkeydown = function (e) {
      var idx = VIEWS.indexOf(e.currentTarget.getAttribute('data-view'));
      var nextIdx = -1;
      if (e.key === 'ArrowRight') { nextIdx = (idx + 1) % VIEWS.length; }
      else if (e.key === 'ArrowLeft') { nextIdx = (idx - 1 + VIEWS.length) % VIEWS.length; }
      else if (e.key === 'Home') { nextIdx = 0; }
      else if (e.key === 'End') { nextIdx = VIEWS.length - 1; }
      if (nextIdx > -1) {
        e.preventDefault();
        switchToView(VIEWS[nextIdx]);
        $('tab-' + VIEWS[nextIdx]).focus();
      }
    };
  }
}

/* ---------- search (combobox + listbox) ---------- */
/*
 * One search for every field that finds a room or building (the top bar, the route's Start): MSCNSearch over
 * APP.searchIndex, ranked the same everywhere, in the ARIA combobox pattern (aria-expanded, aria-activedescendant,
 * arrows, Enter, Escape closes). o: input, list (the listbox), idPrefix (option ids), onChoose(entry, fromKeyboard),
 * and optionally limit, onQuery(text) on every edit, onFocus(), onBlur(), onOpen(isOpen) when the list opens or closes,
 * and onEscape(event) when Escape finds the list already closed.
 */
function searchCombobox(o) {
  var cb = { results: [], active: -1 };
  var input = o.input;
  var list = o.list;

  function text() { return input.value.replace(/^\s+|\s+$/g, ''); }

  function render(query) {
    if (!query || !APP.searchIndex) { close(); return; }
    cb.results = MSCNSearch.search(APP.searchIndex, query, o.limit || 8);
    cb.active = cb.results.length ? 0 : -1;
    var html = '';
    if (!cb.results.length) {
      html = '<li class="empty" role="option" aria-disabled="true">No rooms or buildings match “' + escapeHtml(query) + '”</li>';
    }
    for (var i = 0; i < cb.results.length; i++) {
      var e = cb.results[i];
      var icon = e.kind === 'room'
        ? '<span class="ico" aria-hidden="true">' + escapeHtml(e.title.split(' ')[0].substring(0, 3)) + '</span>'
        : '<span class="ico" aria-hidden="true">' + ICONS.building + '</span>';
      html += '<li role="option" id="' + o.idPrefix + i + '" data-index="' + i + '" aria-selected="' + (i === cb.active ? 'true' : 'false') + '">' +
        icon + '<div><div class="t">' + escapeHtml(e.title) + '</div><div class="s">' + escapeHtml(e.subtitle) + '</div></div></li>';
    }
    list.innerHTML = html;
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    input.setAttribute('aria-activedescendant', cb.active > -1 ? o.idPrefix + cb.active : '');
    var items = list.querySelectorAll('li[data-index]');
    for (var k = 0; k < items.length; k++) {
      items[k].onmousedown = function (ev) { ev.preventDefault(); };
      items[k].onclick = function (ev) { choose(Number(ev.currentTarget.getAttribute('data-index')), false); };
    }
    if (o.onOpen) { o.onOpen(true); }
  }

  function move(delta) {
    if (!cb.results.length) { return; }
    cb.active = (cb.active + delta + cb.results.length) % cb.results.length;
    var items = list.querySelectorAll('li[data-index]');
    for (var i = 0; i < items.length; i++) { items[i].setAttribute('aria-selected', i === cb.active ? 'true' : 'false'); }
    input.setAttribute('aria-activedescendant', o.idPrefix + cb.active);
    if (items[cb.active] && items[cb.active].scrollIntoView) { items[cb.active].scrollIntoView({ block: 'nearest' }); }
  }

  function close() {
    var was = !list.hidden;
    list.hidden = true;
    list.innerHTML = '';
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    cb.results = [];
    cb.active = -1;
    if (was && o.onOpen) { o.onOpen(false); }
  }

  function choose(i, fromKeyboard) {
    var e = cb.results[i];
    if (!e) { return; }
    close();
    o.onChoose(e, fromKeyboard);
  }

  input.oninput = function () { if (o.onQuery) { o.onQuery(text()); } render(text()); };
  input.onfocus = function () { if (o.onFocus) { o.onFocus(); } if (text()) { render(text()); } };
  input.onblur = function () { setTimeout(function () { close(); if (o.onBlur) { o.onBlur(); } }, 150); };
  input.onkeydown = function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) { render(text()); } else { move(1); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { if (cb.active > -1) { e.preventDefault(); choose(cb.active, true); } }
    else if (e.key === 'Escape') {
      if (!list.hidden) { e.preventDefault(); e.stopPropagation(); close(); }
      else if (o.onEscape) { o.onEscape(e); }
    }
  };
  cb.render = render;
  cb.close = close;
  cb.move = move;
  cb.choose = choose;
  return cb;
}

var SEARCH = null;

function chooseSearchResult(e, fromKeyboard) {
  var input = $('search-input');
  input.value = e.title;
  input.blur();
  MSCNAnalytics.track('search', e.kind);
  if (e.kind === 'room') {
    /* On the map a room flies there (its floor in the building view); on the floor plan it opens as before. */
    if (APP.view === 'map' && MAPV.mode === 'map' && MAPV.ready) { focusRoomOnMap(e.roomId); }
    else { openRoom(e.roomId, { moveFocus: fromKeyboard }); }
  } else if (buildingHasIndoor(APP.by.buildings[e.buildingId]) && APP.view === 'indoor') {
    selectBuilding(e.buildingId);
  } else {
    focusBuildingOnMap(e.buildingId);
  }
}

function initSearch() {
  var input = $('search-input');
  var clear = $('search-clear');
  SEARCH = searchCombobox({
    input: input, list: $('search-results'), idPrefix: 'search-opt-', onChoose: chooseSearchResult,
    onQuery: function (q) { clear.hidden = !q; },
    onEscape: function (e) { if (input.value) { e.preventDefault(); input.value = ''; clear.hidden = true; } }
  });
  clear.onclick = function () {
    input.value = '';
    clear.hidden = true;
    SEARCH.close();
    input.focus();
  };
}

/* ---------- service worker (offline; decision mscn-v4-gps-offline-and-google-as-exit-only) ---------- */
var SW = { reg: null, waiting: null, reloading: false };

/* HTTPS and localhost only (browsers refuse workers elsewhere anyway). The worker is sw.js next to the page. */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) { return; }
  var h = window.location.hostname;
  if (window.location.protocol !== 'https:' && h !== 'localhost' && h !== '127.0.0.1' && h !== '[::1]') { return; }
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (!reg) { return; }
    SW.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) { offerUpdate(reg.waiting); }
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      if (!w) { return; }
      w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) { offerUpdate(w); }
      });
    });
  }, function () { /* no offline copy; the app still works online */ });
  /* A new worker took over: this page is the old build, so reload into the new one (every open tab, not only the
     one whose "Reload" was pressed; the worker never claims a page it did not serve). */
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (SW.reloading || hadController) { SW.reloading = false; hadController = false; window.location.reload(); }
  });
}

/* A newer deploy finished caching: "Campus Nav was updated. Reload". */
function offerUpdate(worker) {
  SW.waiting = worker;
  var b = $('update-banner');
  b.hidden = false;
  $('update-reload').onclick = function () {
    SW.reloading = true;
    b.hidden = true;
    worker.postMessage({ type: 'skipWaiting' });
  };
}

/* A new data version: ask the browser to fetch the new sw.js (its precache carries the new data). */
function checkForUpdate() {
  if (SW.reg && SW.reg.update) { try { SW.reg.update(); } catch (e) { /* best effort */ } }
}

/* ---------- boot ---------- */
/* Share links point at this page itself (static hosting: the page URL is the app URL). */
function readAppUrl() {
  var v = MSCNData.pageUrl(window.location);
  return /^https?:\/\//.test(v) ? v : '';
}

function onDataReady(data, version, stale) {
  APP.data = data;
  APP.version = version;
  APP.stale = !!stale;
  try {
    indexData(data);
  } catch (e) {
    showFatal('The campus data could not be read (' + errText(e) + ').');
    return;
  }
  $('stale-banner').hidden = !stale;
  initIndoor();
  initRoute();
  initMap();
  renderSchedule();
  var screen = $('loading-screen');
  screen.className = 'is-done';
  $('app').removeAttribute('aria-hidden');
  setTimeout(function () { screen.hidden = true; }, 300);
  checkDeepLink();
}

function initApp() {
  APP.appUrl = readAppUrl();
  initTabs();
  initSearch();
  $('btn-add-event').onclick = showAddEventForm;
  $('event-cancel').onclick = hideAddEventForm;
  $('event-submit').onclick = submitAddEvent;
  $('event-building').onchange = function (e) { onEventBuildingChange(e.target.value); };
  $('btn-start-scan').onclick = startScan;
  $('btn-stop-scan').onclick = stopScan;
  $('btn-close-panorama').onclick = function () { closePanorama(); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') { return; }
    if (!$('panorama-modal').hidden) { closePanorama(); return; }
    if (!$('event-modal').hidden) { hideAddEventForm(); return; }
    if (!$('room-sheet').hidden) { closeRoomSheet(); $('viewer').focus(); return; }
    if (!$('building-sheet').hidden) { closeBuildingSheet(); }
  });
  loadSiteConfig();
  loadCampusData(onDataReady);
  registerServiceWorker();
}

initApp();
</script>
