<script>
/*
 * Main: tabs, the persistent search box, keyboard handling, and the boot sequence. ES5.
 */
var VIEWS = ['map', 'indoor', 'schedule', 'scan'];

function switchToView(name) {
  if (VIEWS.indexOf(name) === -1) { return; }
  var prev = APP.view;
  for (var i = 0; i < VIEWS.length; i++) {
    var v = VIEWS[i];
    var on = v === name;
    var panel = $('view-' + v);
    panel.className = 'view' + (on ? ' is-active' : '');
    panel.hidden = !on;
    var tab = $('tab-' + v);
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
  }
  APP.view = name;
  if (prev === 'scan' && name !== 'scan') { stopScan(); }
  if (name !== 'map') { closeBuildingSheet(); }
  if (name === 'indoor') { indoorOnShow(); }
  if (name === 'schedule') { renderSchedule(); }
}

function initTabs() {
  var tabs = document.querySelectorAll('.tabbar [role="tab"]');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].onclick = function (e) { switchToView(e.currentTarget.getAttribute('data-view')); };
    tabs[i].onkeydown = function (e) {
      var idx = VIEWS.indexOf(e.currentTarget.getAttribute('data-view'));
      var nextIdx = -1;
      if (e.key === 'ArrowRight') { nextIdx = (idx + 1) % VIEWS.length; }
      else if (e.key === 'ArrowLeft') { nextIdx = (idx - 1 + VIEWS.length) % VIEWS.length; }
      else if (e.key === 'Home') { nextIdx = 0; }
      else if (e.key === 'End') { nextIdx = VIEWS.length - 1; }
      if (nextIdx > -1) {
        e.preventDefault();
        switchToView(VIEWS[nextIdx]);
        $('tab-' + VIEWS[nextIdx]).focus();
      }
    };
  }
}

/* ---------- search (combobox + listbox) ---------- */
var SEARCH = { results: [], active: -1 };

function renderSearchResults(query) {
  var list = $('search-results');
  var input = $('search-input');
  $('search-clear').hidden = !query;
  if (!query || !APP.searchIndex) { closeSearch(); return; }
  SEARCH.results = MSCNSearch.search(APP.searchIndex, query, 8);
  SEARCH.active = SEARCH.results.length ? 0 : -1;
  var html = '';
  if (!SEARCH.results.length) {
    html = '<li class="empty" role="option" aria-disabled="true">No rooms or buildings match “' + escapeHtml(query) + '”</li>';
  }
  for (var i = 0; i < SEARCH.results.length; i++) {
    var e = SEARCH.results[i];
    var icon = e.kind === 'room'
      ? '<span class="ico" aria-hidden="true">' + escapeHtml(e.title.split(' ')[0].substring(0, 3)) + '</span>'
      : '<span class="ico" aria-hidden="true">' + ICONS.building + '</span>';
    html += '<li role="option" id="search-opt-' + i + '" data-index="' + i + '" aria-selected="' + (i === SEARCH.active ? 'true' : 'false') + '">' +
      icon + '<div><div class="t">' + escapeHtml(e.title) + '</div><div class="s">' + escapeHtml(e.subtitle) + '</div></div></li>';
  }
  list.innerHTML = html;
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  input.setAttribute('aria-activedescendant', SEARCH.active > -1 ? 'search-opt-' + SEARCH.active : '');
  var items = list.querySelectorAll('li[data-index]');
  for (var k = 0; k < items.length; k++) {
    items[k].onmousedown = function (ev) { ev.preventDefault(); };
    items[k].onclick = function (ev) { chooseSearchResult(Number(ev.currentTarget.getAttribute('data-index')), false); };
  }
}

function moveSearchActive(delta) {
  if (!SEARCH.results.length) { return; }
  SEARCH.active = (SEARCH.active + delta + SEARCH.results.length) % SEARCH.results.length;
  var items = $('search-results').querySelectorAll('li[data-index]');
  for (var i = 0; i < items.length; i++) { items[i].setAttribute('aria-selected', i === SEARCH.active ? 'true' : 'false'); }
  $('search-input').setAttribute('aria-activedescendant', 'search-opt-' + SEARCH.active);
  if (items[SEARCH.active] && items[SEARCH.active].scrollIntoView) { items[SEARCH.active].scrollIntoView({ block: 'nearest' }); }
}

function closeSearch() {
  var list = $('search-results');
  list.hidden = true;
  list.innerHTML = '';
  var input = $('search-input');
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
  SEARCH.results = [];
  SEARCH.active = -1;
}

function chooseSearchResult(i, fromKeyboard) {
  var e = SEARCH.results[i];
  if (!e) { return; }
  var input = $('search-input');
  input.value = e.title;
  closeSearch();
  input.blur();
  MSCNAnalytics.track('search', e.kind);
  if (e.kind === 'room') {
    openRoom(e.roomId, { moveFocus: fromKeyboard });
  } else if (buildingHasIndoor(APP.by.buildings[e.buildingId]) && APP.view === 'indoor') {
    selectBuilding(e.buildingId);
  } else {
    focusBuildingOnMap(e.buildingId);
  }
}

function initSearch() {
  var input = $('search-input');
  input.oninput = function () { renderSearchResults(input.value.replace(/^\s+|\s+$/g, '')); };
  input.onfocus = function () { if (input.value) { renderSearchResults(input.value.replace(/^\s+|\s+$/g, '')); } };
  input.onblur = function () { setTimeout(closeSearch, 150); };
  input.onkeydown = function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if ($('search-results').hidden) { renderSearchResults(input.value); } else { moveSearchActive(1); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchActive(-1); }
    else if (e.key === 'Enter') { if (SEARCH.active > -1) { e.preventDefault(); chooseSearchResult(SEARCH.active, true); } }
    else if (e.key === 'Escape') { if (!$('search-results').hidden) { e.preventDefault(); closeSearch(); } else if (input.value) { input.value = ''; $('search-clear').hidden = true; } }
  };
  $('search-clear').onclick = function () {
    input.value = '';
    $('search-clear').hidden = true;
    closeSearch();
    input.focus();
  };
}

/* ---------- boot ---------- */
/* Share links point at this page itself (static hosting: the page URL is the app URL). */
function readAppUrl() {
  var v = MSCNData.pageUrl(window.location);
  return /^https?:\/\//.test(v) ? v : '';
}

function onDataReady(data, version, stale) {
  APP.data = data;
  APP.version = version;
  APP.stale = !!stale;
  try {
    indexData(data);
  } catch (e) {
    showFatal('The campus data could not be read (' + errText(e) + ').');
    return;
  }
  $('stale-banner').hidden = !stale;
  initIndoor();
  whenSiteConfig(initMap);
  renderSchedule();
  var screen = $('loading-screen');
  screen.className = 'is-done';
  $('app').removeAttribute('aria-hidden');
  setTimeout(function () { screen.hidden = true; }, 300);
  checkDeepLink();
}

function initApp() {
  APP.appUrl = readAppUrl();
  initTabs();
  initSearch();
  $('btn-add-event').onclick = showAddEventForm;
  $('event-cancel').onclick = hideAddEventForm;
  $('event-submit').onclick = submitAddEvent;
  $('event-building').onchange = function (e) { onEventBuildingChange(e.target.value); };
  $('btn-start-scan').onclick = startScan;
  $('btn-stop-scan').onclick = stopScan;
  $('btn-close-panorama').onclick = function () { closePanorama(); };
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') { return; }
    if (!$('panorama-modal').hidden) { closePanorama(); return; }
    if (!$('event-modal').hidden) { hideAddEventForm(); return; }
    if (!$('room-sheet').hidden) { closeRoomSheet(); $('viewer').focus(); return; }
    if (!$('building-sheet').hidden) { closeBuildingSheet(); }
  });
  loadSiteConfig();
  loadCampusData(onDataReady);
}

initApp();
</script>
