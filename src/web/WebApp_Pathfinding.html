<script>
/*
 * MSCNPath: one route engine over the indoor graphs (NavNodes / NavEdges, Data contract v2) and, since v4, the
 * outdoor footpath graph (data/campus-map/outdoor-graph.json), joined at entrance node ids
 * (decision mscn-v4-georeferenced-entrances-and-unified-routing).
 * Pure ES5, no DOM access: the same file is loaded by the web app (as an include)
 * and by the Node unit tests (tests/unit), which strip the <script> tags.
 *
 * Costs are meters (NavEdges.distance, outdoor edge distance). Edges are walkable both ways.
 * Cross-floor edges join stair/elevator nodes; "accessible" false marks stairs (indoors) and steps (outdoors).
 *   buildGraph(data, opts)                 the indoor graph
 *   addOutdoorGraph(graph, outdoor)        union with the outdoor graph; entrances gain lat/lng and join by id
 *   findPath(graph, starts, goals, opts)   A*; starts/goals are ids or {id, cost} (cost = meters to reach the node,
 *                                          e.g. from a GPS point snapped onto an edge)
 *   snapEnds(route, start, goal)           the partial edges of a snapped start / goal made part of the route
 *   segmentRoute(graph, route)             typed segments: outdoor | indoor (per floor), joined by doors and stairs
 *   buildRouteSteps(graph, segments, names) one step list: outdoor walk, door, indoor legs, arrival
 * segmentPath / buildSteps are the v3 indoor-only forms, kept for their callers and tests.
 *
 * v5 access classes (plan mscn-v5-access-classes-and-editors): doors, entrances, waypoints (and so hallways) and outdoor
 * edges are main, alt or emergency (accessOf). A route walks main at its length, alt at its length times
 * opts.altFactor (default 3), and never walks through emergency.
 *
 * v5.1 confusion (plan mscn-v5-1-route-choice-and-private-floors): an indoor walk also pays, in meters, for what makes
 * it hard to follow: opts.turnCost per turn sharper than 45 degrees, opts.floorChangeCost per stair or elevator ride,
 * opts.junctionCost per hallway junction passed, opts.roomCost per room walked through; and each side (alt) door or
 * entrance passed through costs opts.sideDoorCost. So a side door wins when it makes the way to the room simpler, not
 * when it only saves a little walking. opts.avoidNodes / opts.avoidEdges ({id: true}) keep a route off doors and path
 * segments (Front door only, a locked door, a blocked path); nothing ever opens emergency.
 */
var MSCNPath = (function () {
  'use strict';

  var DEFAULT_MPP = 0.0254;
  var WALK_SPEED_MPS = 1.3;
  var DEFAULT_ALT_FACTOR = 3;
  /* The v5.1 cost model in meters, one set with the export (scripts/data/access.mjs ROUTING_WEIGHTS; README "How a route
     is chosen"), measured on the real campus. */
  var DEFAULTS = { turnCost: 15, floorChangeCost: 120, junctionCost: 8, roomCost: 15, sideDoorCost: 300 };
  var TURN_DEGREES = 45;
  /* An indoor edge shorter than this has no direction worth calling a turn (door swings, snapped hub links). */
  var TURN_MIN_METERS = 0.75;

  function toBool(v, dflt) {
    if (v === true || v === false) { return v; }
    if (v === null || v === undefined || v === '') { return dflt; }
    if (typeof v === 'number') { return v !== 0; }
    var s = String(v).replace(/^\s+|\s+$/g, '').toLowerCase();
    if (s === 'true' || s === 'yes' || s === 'y' || s === '1') { return true; }
    if (s === 'false' || s === 'no' || s === 'n' || s === '0') { return false; }
    return dflt;
  }

  function num(v, dflt) {
    if (v === null || v === undefined || v === '') { return dflt; }
    var n = Number(v);
    return isFinite(n) ? n : dflt;
  }

  /* Binary min-heap of {id, pri}. */
  function MinHeap() { this.a = []; }
  MinHeap.prototype.size = function () { return this.a.length; };
  MinHeap.prototype.push = function (id, pri) {
    var a = this.a;
    a.push({ id: id, pri: pri });
    var i = a.length - 1;
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (a[p].pri <= a[i].pri) { break; }
      var t = a[p]; a[p] = a[i]; a[i] = t;
      i = p;
    }
  };
  MinHeap.prototype.pop = function () {
    var a = this.a;
    var top = a[0];
    var last = a.pop();
    if (a.length > 0) {
      a[0] = last;
      var i = 0;
      var n = a.length;
      while (true) {
        var l = 2 * i + 1;
        var r = l + 1;
        var m = i;
        if (l < n && a[l].pri < a[m].pri) { m = l; }
        if (r < n && a[r].pri < a[m].pri) { m = r; }
        if (m === i) { break; }
        var t = a[m]; a[m] = a[i]; a[i] = t;
        i = m;
      }
    }
    return top;
  };

  /* The access class of a nav node, outdoor node or edge: 'main' | 'alt' | 'emergency' (missing reads 'main'). */
  function accessOf(item) {
    if (!item) { return 'main'; }
    var a = String(item.access || '').toLowerCase();
    return a === 'alt' || a === 'emergency' ? a : 'main';
  }

  function altFactorOf(opts) {
    var f = num(opts && opts.altFactor, DEFAULT_ALT_FACTOR);
    return f >= 1 ? f : 1;
  }

  /* A cost-model weight from opts (meters, at least 0), else its default. */
  function weightOf(opts, key) {
    var c = num(opts && opts[key], DEFAULTS[key]);
    return c > 0 ? c : 0;
  }

  function weightsOf(opts) {
    var w = {};
    for (var k in DEFAULTS) { if (DEFAULTS.hasOwnProperty(k)) { w[k] = weightOf(opts, k); } }
    return w;
  }

  function floorMpp(floors, floorId) {
    var f = floors[floorId];
    var m = f ? num(f.metersPerPixel, 0) : 0;
    return m > 0 ? m : DEFAULT_MPP;
  }

  function planarMeters(floors, a, b) {
    var dx = num(a.x, 0) - num(b.x, 0);
    var dy = num(a.y, 0) - num(b.y, 0);
    return Math.sqrt(dx * dx + dy * dy) * floorMpp(floors, a.floorId);
  }

  function isTransitionType(t) { return t === 'stair' || t === 'elevator'; }

  function hasLngLat(n) {
    return !!n && n.lat !== undefined && n.lat !== null && n.lat !== '' && n.lng !== undefined && n.lng !== null && n.lng !== '' &&
      isFinite(Number(n.lat)) && isFinite(Number(n.lng));
  }

  /* Great-circle meters between two {lat, lng} (kept local so this file stays self-contained; MSCNGeo has the same). */
  function geoMeters(a, b) {
    var r = Math.PI / 180;
    var dLat = (Number(b.lat) - Number(a.lat)) * r;
    var dLng = (Number(b.lng) - Number(a.lng)) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(Number(a.lat) * r) * Math.cos(Number(b.lat) * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function edgeCost(edge, a, b, floors) {
    var d = num(edge.distance, NaN);
    if (isFinite(d) && d > 0) { return d; }
    if (a.floorId === b.floorId) { return Math.max(planarMeters(floors, a, b), 0.01); }
    return (a.type === 'elevator' || b.type === 'elevator') ? 12 : 8;
  }

  /* accessible column wins when present; otherwise a cross-floor stair edge is not accessible. */
  function edgeAccessible(edge, a, b) {
    var v = toBool(edge.accessible, null);
    if (v !== null) { return v; }
    if (a.floorId !== b.floorId && (a.type === 'stair' || b.type === 'stair')) { return false; }
    return true;
  }

  /*
   * buildGraph(data, opts)
   *   data: { floors, navNodes, navEdges }
   *   opts.floorFilter(floor, floorId) -> bool : drop nodes on floors that fail (hidden floors)
   */
  function buildGraph(data, opts) {
    opts = opts || {};
    var floors = {};
    var nodes = {};
    var adj = {};
    var byRoom = {};
    var i;
    var fl = (data && data.floors) || [];
    for (i = 0; i < fl.length; i++) { if (fl[i] && fl[i].id) { floors[fl[i].id] = fl[i]; } }

    var nn = (data && data.navNodes) || [];
    for (i = 0; i < nn.length; i++) {
      var n = nn[i];
      if (!n || !n.id) { continue; }
      if (opts.floorFilter && !opts.floorFilter(floors[n.floorId], n.floorId)) { continue; }
      nodes[n.id] = n;
      adj[n.id] = [];
      if (n.roomId) {
        if (!byRoom[n.roomId]) { byRoom[n.roomId] = []; }
        byRoom[n.roomId].push(n.id);
      }
    }

    var ee = (data && data.navEdges) || [];
    for (i = 0; i < ee.length; i++) {
      var e = ee[i];
      if (!e) { continue; }
      var a = nodes[e.fromNodeId];
      var b = nodes[e.toNodeId];
      if (!a || !b || a === b) { continue; }
      var cost = edgeCost(e, a, b, floors);
      var acc = edgeAccessible(e, a, b);
      var ea = e.access ? accessOf(e) : '';
      adj[a.id].push({ to: b.id, cost: cost, accessible: acc, edgeId: e.id, access: ea });
      adj[b.id].push({ to: a.id, cost: cost, accessible: acc, edgeId: e.id, access: ea });
    }

    /* Room nodes first, then doors, then anything else tied to the room. */
    var rank = { room: 0, door: 1 };
    for (var rid in byRoom) {
      if (byRoom.hasOwnProperty(rid)) {
        byRoom[rid].sort(function (x, y) {
          var rx = rank.hasOwnProperty(nodes[x].type) ? rank[nodes[x].type] : 2;
          var ry = rank.hasOwnProperty(nodes[y].type) ? rank[nodes[y].type] : 2;
          return rx - ry;
        });
      }
    }

    return { nodes: nodes, adj: adj, floors: floors, byRoom: byRoom };
  }

  function toIdList(graph, ids) {
    var list = Object.prototype.toString.call(ids) === '[object Array]' ? ids : [ids];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && graph.nodes[list[i]] && out.indexOf(list[i]) === -1) { out.push(list[i]); }
    }
    return out;
  }

  /* ids | [ids] | [{id, cost}] -> {id: cost} (the smallest cost per id), unknown ids dropped. */
  function toEndpoints(graph, list) {
    var arr = Object.prototype.toString.call(list) === '[object Array]' ? list : [list];
    var out = {};
    var n = 0;
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      if (!it) { continue; }
      var id = typeof it === 'object' ? it.id : it;
      var c = typeof it === 'object' ? num(it.cost, 0) : 0;
      if (!graph.nodes[id]) { continue; }
      if (!out.hasOwnProperty(id)) { n++; out[id] = c; } else if (c < out[id]) { out[id] = c; }
    }
    return n ? out : null;
  }

  var GOAL = '\u0000goal';

  /* A hallway point: a waypoint, stair or elevator node indoors. */
  function isHallPoint(n) { return !!n && !n.outdoor && (n.type === 'waypoint' || n.type === 'stair' || n.type === 'elevator'); }

  /* A hallway junction: a waypoint where three or more hallway ways meet (doors into rooms do not count). */
  function junctionAt(graph, nid) {
    var n = graph.nodes[nid];
    if (!n || n.outdoor || n.type !== 'waypoint') { return false; }
    if (!graph.junctions) { graph.junctions = {}; }
    if (graph.junctions.hasOwnProperty(nid)) { return graph.junctions[nid]; }
    var seen = {};
    var c = 0;
    var a = graph.adj[nid] || [];
    for (var i = 0; i < a.length; i++) {
      var m = graph.nodes[a[i].to];
      if (a[i].outdoor || seen[a[i].to] || !isHallPoint(m) || m.floorId !== n.floorId) { continue; }
      seen[a[i].to] = true;
      c++;
    }
    graph.junctions[nid] = c >= 3;
    return graph.junctions[nid];
  }

  /* Is a -> b -> c a turn: sharper than TURN_DEGREES, on one floor, both legs long enough to have a direction? */
  function turnAt(graph, aId, bId, cId) {
    var a = graph.nodes[aId];
    var b = graph.nodes[bId];
    var c = graph.nodes[cId];
    if (!a || !b || !c || a.outdoor || b.outdoor || c.outdoor || a.floorId !== b.floorId || b.floorId !== c.floorId) { return false; }
    var m = floorMpp(graph.floors, b.floorId);
    var x1 = (num(b.x, 0) - num(a.x, 0)) * m;
    var y1 = (num(b.y, 0) - num(a.y, 0)) * m;
    var x2 = (num(c.x, 0) - num(b.x, 0)) * m;
    var y2 = (num(c.y, 0) - num(b.y, 0)) * m;
    var l1 = Math.sqrt(x1 * x1 + y1 * y1);
    var l2 = Math.sqrt(x2 * x2 + y2 * y2);
    if (l1 < TURN_MIN_METERS || l2 < TURN_MIN_METERS) { return false; }
    return (x1 * x2 + y1 * y2) / (l1 * l2) < Math.cos(TURN_DEGREES * Math.PI / 180);
  }

  function floorChange(graph, aId, bId) {
    var a = graph.nodes[aId];
    var b = graph.nodes[bId];
    return !!a && !!b && !a.outdoor && !b.outdoor && a.floorId !== b.floorId;
  }

  /* An alt door or entrance (a side door). */
  function isSideDoor(graph, nid) {
    var n = graph.nodes[nid];
    return !!n && (n.type === 'door' || n.type === 'entrance') && accessOf(n) === 'alt';
  }

  /*
   * The confusion of stepping from cur to next, having come from prev (null at the start), as counts
   * {turns, floorChanges, junctions, rooms}. A stair or elevator ride through several floors is one floor change.
   */
  function stepConfusion(graph, prev, cur, next) {
    var out = { turns: 0, floorChanges: 0, junctions: 0, rooms: 0 };
    if (floorChange(graph, cur, next)) {
      if (!(prev && floorChange(graph, prev, cur))) { out.floorChanges = 1; }
      return out;
    }
    if (!prev) { return out; }
    if (turnAt(graph, prev, cur, next)) { out.turns = 1; }
    if (junctionAt(graph, cur)) { out.junctions = 1; }
    var c = graph.nodes[cur];
    if (c && !c.outdoor && c.type === 'room') { out.rooms = 1; }
    return out;
  }

  /*
   * routeConfusion(graph, route) -> {turns, floorChanges, junctions, rooms, sideDoors, indoorMeters}
   *   What findPath priced along a route, as counts (for the step that says why a side door was chosen).
   */
  function routeConfusion(graph, route) {
    var ids = route && route.nodeIds ? route.nodeIds : [];
    var t = { turns: 0, floorChanges: 0, junctions: 0, rooms: 0, sideDoors: 0, indoorMeters: 0 };
    for (var i = 0; i < ids.length; i++) {
      if (isSideDoor(graph, ids[i])) { t.sideDoors++; }
      if (i === ids.length - 1) { break; }
      var c = stepConfusion(graph, i > 0 ? ids[i - 1] : null, ids[i], ids[i + 1]);
      t.turns += c.turns; t.floorChanges += c.floorChanges; t.junctions += c.junctions; t.rooms += c.rooms;
      var e = stepEdge(graph, ids[i], ids[i + 1]);
      if (e && !e.outdoor) { t.indoorMeters += e.cost; }
    }
    return t;
  }

  /*
   * The graph as arrays for findPath (built once, rebuilt when nodes or edges are added): per node its id, floor,
   * position in meters and what the confusion score asks of it (classes are read per search); per directed edge (node n's adjacency entries
   * base[n] .. base[n + 1] - 1) its ends, the adjacency entry and its direction in meters.
   */
  function indexed(graph) {
    var count = 0;
    var nid;
    for (nid in graph.adj) { if (graph.adj.hasOwnProperty(nid)) { count += graph.adj[nid].length + 1; } }
    var ix = graph._ix;
    if (ix && ix.sig === count && ix.nodesRef === graph.nodes) { return ix; }
    ix = { sig: count, nodesRef: graph.nodes, ids: [], at: {}, base: [], to: [], from: [], edge: [], len: [], dx: [], dy: [],
      floor: [], xm: [], ym: [], outdoor: [], junction: [], room: [] };
    for (nid in graph.nodes) {
      if (!graph.nodes.hasOwnProperty(nid)) { continue; }
      var n = graph.nodes[nid];
      var m = n.outdoor ? 0 : floorMpp(graph.floors, n.floorId);
      ix.at[nid] = ix.ids.length;
      ix.ids.push(nid);
      ix.floor.push(n.outdoor ? null : n.floorId);
      ix.xm.push(num(n.x, 0) * m);
      ix.ym.push(num(n.y, 0) * m);
      ix.outdoor.push(!!n.outdoor);
      ix.junction.push(junctionAt(graph, nid));
      ix.room.push(!n.outdoor && n.type === 'room');
    }
    for (var i = 0; i < ix.ids.length; i++) {
      ix.base.push(ix.to.length);
      var a = graph.adj[ix.ids[i]] || [];
      for (var k = 0; k < a.length; k++) {
        var t = ix.at[a[k].to];
        if (t === undefined) { continue; }
        var dx = ix.xm[t] - ix.xm[i];
        var dy = ix.ym[t] - ix.ym[i];
        ix.to.push(t);
        ix.from.push(i);
        ix.edge.push(a[k]);
        ix.dx.push(dx);
        ix.dy.push(dy);
        ix.len.push(ix.floor[t] === ix.floor[i] ? Math.sqrt(dx * dx + dy * dy) : 0);
      }
    }
    ix.base.push(ix.to.length);
    graph._ix = ix;
    return ix;
  }

  /*
   * findPath(graph, starts, goals, opts) -> route | null
   *   starts / goals: a node id, an array of ids, or an array of {id, cost} (multi-source / multi-goal; cost is the
   *   extra meters before the start node or after the goal node).
   *   opts.accessibleOnly: skip edges with accessible === false (indoor stairs, outdoor steps).
   *   opts.indoorOnly: skip the outdoor edges (can these doors reach the goal without going outside?).
   *   opts.altFactor: the weight of an alt edge or an edge touching an alt node (default 3, at least 1).
   *   opts.turnCost, floorChangeCost, junctionCost, roomCost: meters added per indoor turn, floor change, hallway
   *   junction passed and room walked through (defaults in DEFAULTS; 0 turns that part off).
   *   opts.sideDoorCost: meters added once for each alt door or entrance on the route, its start and end included.
   *   opts.avoidNodes / opts.avoidEdges: {id: true}, never walked (Front door only, a locked door, a blocked path).
   *   opts.allowEmergency: walk emergency nodes and edges too (only to tell "no route without an emergency exit").
   *   Without allowEmergency no emergency node or edge is ever on a route, not even as its start or goal (a code
   *   scanned at an emergency door starts from nearestOpenNode instead).
   *   route = { nodeIds, nodes, distance (meters, including both end costs), cost (the weighted search cost),
   *             startCost, goalCost }
   * The search runs over directed edges (where the walk came from) so that a turn can be priced; with no turn, floor
   * change, junction or room cost it is the plain search over nodes. Outdoor nodes are one state each either way.
   */
  function findPath(graph, startIds, goalIds, opts) {
    opts = opts || {};
    var starts = toEndpoints(graph, startIds);
    var goals = toEndpoints(graph, goalIds);
    if (!starts || !goals) { return null; }
    var ix = indexed(graph);
    var N = ix.ids.length;
    var D = ix.to.length;
    var goalList = [];
    var id;
    for (id in goals) { if (goals.hasOwnProperty(id)) { goalList.push(id); } }
    var single = goalList.length === 1 ? graph.nodes[goalList[0]] : null;
    var factor = altFactorOf(opts);
    var w = weightsOf(opts);
    var shaped = w.turnCost > 0 || w.floorChangeCost > 0 || w.junctionCost > 0 || w.roomCost > 0;
    var cosTurn = Math.cos(TURN_DEGREES * Math.PI / 180);
    var avoidN = opts.avoidNodes || {};
    var avoidE = opts.avoidEdges || {};
    var emergencyOk = !!opts.allowEmergency;
    var blocked = [];
    var goalAt = [];
    var cls = [];
    var side = [];
    var i;
    for (i = 0; i < N; i++) {
      cls.push(accessOf(graph.nodes[ix.ids[i]]));
      side.push(isSideDoor(graph, ix.ids[i]));
      blocked.push((!emergencyOk && cls[i] === 'emergency') || (avoidN.hasOwnProperty(ix.ids[i]) && !!avoidN[ix.ids[i]]));
      goalAt.push(-1);
    }
    for (id in goals) { if (goals.hasOwnProperty(id)) { goalAt[ix.at[id]] = goals[id]; } }

    /* Planar distance on the goal's own floor, else 0: consistent across floors and the outdoor graph. */
    var gi = single && !single.outdoor ? ix.at[single.id] : -1;
    function h(n) {
      if (gi < 0 || ix.outdoor[n] || ix.floor[n] !== ix.floor[gi]) { return 0; }
      var dx = ix.xm[n] - ix.xm[gi];
      var dy = ix.ym[n] - ix.ym[gi];
      return Math.sqrt(dx * dx + dy * dy);
    }
    /* State s < D: at to[s], having walked directed edge s; state D + n: at node n (a start, an outdoor node, or any
       node when the shape is not priced). */
    function stateOf(d) { var n = ix.to[d]; return shaped && !ix.outdoor[n] ? d : D + n; }
    function confusion(d, cur, next, nd) {
      /* d: the directed edge into cur (-1 at a start); nd: the directed edge cur -> next. */
      if (ix.outdoor[cur] || ix.outdoor[next]) { return 0; }
      var c = 0;
      var from = d >= 0 ? ix.from[d] : -1;
      if (ix.floor[cur] !== ix.floor[next]) {
        return from >= 0 && !ix.outdoor[from] && ix.floor[from] !== ix.floor[cur] ? 0 : w.floorChangeCost;
      }
      if (from < 0) { return 0; }
      if (w.turnCost && !ix.outdoor[from] && ix.floor[from] === ix.floor[cur] && ix.len[d] >= TURN_MIN_METERS && ix.len[nd] >= TURN_MIN_METERS &&
          (ix.dx[d] * ix.dx[nd] + ix.dy[d] * ix.dy[nd]) / (ix.len[d] * ix.len[nd]) < cosTurn) { c += w.turnCost; }
      if (ix.junction[cur]) { c += w.junctionCost; }
      if (ix.room[cur]) { c += w.roomCost; }
      return c;
    }

    var S = D + N;
    var g = new Array(S);
    var came = new Array(S);
    var cameVia = new Array(S);
    var closed = new Array(S);
    var heap = new MinHeap();
    for (id in starts) {
      if (!starts.hasOwnProperty(id)) { continue; }
      var sn = ix.at[id];
      if (blocked[sn]) { continue; }
      var sg = starts[id] + (w.sideDoorCost && side[sn] ? w.sideDoorCost : 0);
      g[D + sn] = sg;
      came[D + sn] = -1;
      heap.push(D + sn, sg + h(sn));
    }
    var bestGoal = Infinity;
    var bestState = -1;
    while (heap.size() > 0) {
      var top = heap.pop();
      var st = top.id;
      if (st === S) { break; }
      if (closed[st]) { continue; }
      closed[st] = true;
      var cur = st >= D ? st - D : ix.to[st];
      var into = st < D ? st : -1;
      if (goalAt[cur] >= 0 && g[st] + goalAt[cur] < bestGoal) {
        bestGoal = g[st] + goalAt[cur];
        bestState = st;
        heap.push(S, bestGoal);
      }
      var prevNode = st < D ? ix.from[st] : (came[st] >= 0 ? (came[st] < D ? ix.to[came[st]] : came[st] - D) : -1);
      var lo = ix.base[cur];
      var hi = ix.base[cur + 1];
      for (var d = lo; d < hi; d++) {
        var nb = ix.edge[d];
        var to = ix.to[d];
        if (to === prevNode || blocked[to]) { continue; }
        if (opts.accessibleOnly && !nb.accessible) { continue; }
        if (opts.indoorOnly && nb.outdoor) { continue; }
        if (!emergencyOk && nb.access === 'emergency') { continue; }
        if (nb.edgeId && avoidE.hasOwnProperty(nb.edgeId) && avoidE[nb.edgeId]) { continue; }
        var ns = stateOf(d);
        if (closed[ns]) { continue; }
        var alt = nb.access === 'alt' || cls[to] === 'alt' || cls[cur] === 'alt';
        var ng = g[st] + (alt ? nb.cost * factor : nb.cost) + (w.sideDoorCost && side[to] ? w.sideDoorCost : 0) +
          (shaped && !nb.outdoor ? confusion(into, cur, to, d) : 0);
        if (g[ns] === undefined || ng < g[ns]) {
          g[ns] = ng;
          came[ns] = st;
          cameVia[ns] = d;
          heap.push(ns, ng + h(to));
        }
      }
    }
    if (bestState < 0) { return null; }
    var nodesRev = [];
    var edgesRev = [];
    var s2 = bestState;
    while (s2 >= 0) {
      nodesRev.push(s2 >= D ? s2 - D : ix.to[s2]);
      edgesRev.push(cameVia[s2] === undefined ? -1 : cameVia[s2]);
      s2 = came[s2];
    }
    var ids = [];
    var nodes = [];
    var meters = 0;
    for (var j = nodesRev.length - 1; j >= 0; j--) {
      ids.push(ix.ids[nodesRev[j]]);
      nodes.push(graph.nodes[ix.ids[nodesRev[j]]]);
      if (edgesRev[j] >= 0) { meters += ix.edge[edgesRev[j]].cost; }
    }
    meters += starts[ids[0]] + goals[ids[ids.length - 1]];
    return { nodeIds: ids, nodes: nodes, distance: meters, cost: bestGoal, startCost: starts[ids[0]], goalCost: goals[ids[ids.length - 1]] };
  }

  /*
   * nearestOpenNode(graph, nodeId, opts) -> {id, distance} | null
   *   The node a route may start from in place of an emergency one (a code scanned at an emergency exit): the nearest
   *   node, by walking distance over any edge, that is not emergency and has a non-emergency edge (so a route can leave
   *   it). opts.accessibleOnly skips stairs. A node that is not emergency is its own answer, at 0 m.
   */
  function nearestOpenNode(graph, nodeId, opts) {
    opts = opts || {};
    if (!graph.nodes[nodeId]) { return null; }
    function open(nid) {
      if (accessOf(graph.nodes[nid]) === 'emergency') { return false; }
      var a = graph.adj[nid] || [];
      for (var k = 0; k < a.length; k++) {
        if (a[k].access !== 'emergency' && accessOf(graph.nodes[a[k].to]) !== 'emergency') { return true; }
      }
      return false;
    }
    if (accessOf(graph.nodes[nodeId]) !== 'emergency') { return { id: nodeId, distance: 0 }; }
    var dist = {};
    var done = {};
    var heap = new MinHeap();
    dist[nodeId] = 0;
    heap.push(nodeId, 0);
    while (heap.size() > 0) {
      var cur = heap.pop().id;
      if (done[cur]) { continue; }
      done[cur] = true;
      if (open(cur)) { return { id: cur, distance: dist[cur] }; }
      var nbrs = graph.adj[cur] || [];
      for (var i = 0; i < nbrs.length; i++) {
        var nb = nbrs[i];
        if (opts.accessibleOnly && !nb.accessible) { continue; }
        var nd = dist[cur] + nb.cost;
        if (!done[nb.to] && (!dist.hasOwnProperty(nb.to) || nd < dist[nb.to])) { dist[nb.to] = nd; heap.push(nb.to, nd); }
      }
    }
    return null;
  }

  function stepEdge(graph, aId, bId) {
    var nbrs = graph.adj[aId] || [];
    var best = null;
    for (var i = 0; i < nbrs.length; i++) {
      if (nbrs[i].to === bId && (!best || nbrs[i].cost < best.cost)) { best = nbrs[i]; }
    }
    return best;
  }

  function stepCost(graph, aId, bId) {
    var e = stepEdge(graph, aId, bId);
    return e ? e.cost : 0;
  }

  function floorLevel(graph, floorId) {
    var f = graph.floors[floorId];
    return f ? num(f.level, 0) : 0;
  }

  /*
   * segmentPath(graph, route) -> [segment]
   *   segment = { floorId, nodes, distance, exit?: transition, entry?: transition }
   *   transition = { type: 'stair'|'elevator', fromFloorId, toFloorId, direction: 'up'|'down',
   *                  fromNode, toNode, floors: number of floors travelled }
   * Riding a stair or elevator through several floors collapses into one transition.
   */
  function segmentPath(graph, route) {
    if (!route || !route.nodes || !route.nodes.length) { return []; }
    var nodes = route.nodes;
    var segments = [];
    var cur = { floorId: nodes[0].floorId, nodes: [nodes[0]], distance: 0 };
    for (var i = 1; i < nodes.length; i++) {
      var a = nodes[i - 1];
      var b = nodes[i];
      if (a.floorId === b.floorId) {
        cur.nodes.push(b);
        cur.distance += stepCost(graph, a.id, b.id);
        continue;
      }
      var type = (a.type === 'elevator' || b.type === 'elevator') ? 'elevator' : 'stair';
      var prev = segments.length ? segments[segments.length - 1] : null;
      if (prev && cur.nodes.length === 1 && cur.entry && cur.entry.type === type) {
        /* Pass-through floor: extend the previous transition. */
        prev.exit.toFloorId = b.floorId;
        prev.exit.toNode = b;
        prev.exit.floors += 1;
        prev.exit.direction = floorLevel(graph, b.floorId) >= floorLevel(graph, prev.exit.fromFloorId) ? 'up' : 'down';
        cur = { floorId: b.floorId, nodes: [b], distance: 0, entry: prev.exit };
        continue;
      }
      var t = {
        type: type,
        fromFloorId: a.floorId,
        toFloorId: b.floorId,
        direction: floorLevel(graph, b.floorId) >= floorLevel(graph, a.floorId) ? 'up' : 'down',
        fromNode: a,
        toNode: b,
        floors: 1
      };
      cur.exit = t;
      segments.push(cur);
      cur = { floorId: b.floorId, nodes: [b], distance: 0, entry: t };
    }
    segments.push(cur);
    return segments;
  }

  function formatMeters(m) {
    if (!isFinite(m) || m <= 0) { return '0 m'; }
    if (m < 10) { return Math.round(m) + ' m'; }
    return (Math.round(m / 5) * 5) + ' m';
  }

  function formatMinutes(m) {
    var mins = Math.max(1, Math.round(m / WALK_SPEED_MPS / 60));
    return mins + ' min';
  }

  /*
   * buildSteps(graph, segments, names) -> [step]
   *   names.floorLabel(floorId) -> 'Floor 2'
   *   names.destination -> 'IT 241'
   *   names.transitionName(node, type) -> optional proper name ('Stair 1')
   *   step = { kind: 'walk', index, floorId, title, detail, distance, nodeIds }
   */
  function buildSteps(graph, segments, names) {
    names = names || {};
    var floorLabel = names.floorLabel || function (id) { return id; };
    var dest = names.destination || 'your destination';
    var steps = [];
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      var ids = [];
      for (var k = 0; k < s.nodes.length; k++) { ids.push(s.nodes[k].id); }
      var walk = formatMeters(s.distance);
      var title;
      var detail;
      if (s.exit) {
        var t = s.exit;
        var proper = names.transitionName ? names.transitionName(t.fromNode, t.type) : '';
        var thing = proper || (t.type === 'elevator' ? 'the elevator' : 'the stairs');
        title = 'Take ' + thing + ' ' + t.direction + ' to ' + floorLabel(t.toFloorId);
        detail = s.distance > 0.5
          ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + ' to ' + thing + '.'
          : 'Start at ' + thing + ' on ' + floorLabel(s.floorId) + '.';
      } else {
        title = 'Arrive at ' + dest;
        detail = s.distance > 0.5
          ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + '.'
          : 'You are there.';
      }
      steps.push({
        kind: 'walk', index: i, floorId: s.floorId, title: title, detail: detail,
        distance: s.distance, nodeIds: ids
      });
    }
    return steps;
  }

  /* Nodes that stand for a room (room node, then door nodes); its emergency doors only when it has nothing else, so a
     route to or from a room never begins or ends at an emergency exit it could avoid. */
  function nodesForRoom(graph, roomId) {
    var all = graph.byRoom[roomId] || [];
    var out = [];
    for (var i = 0; i < all.length; i++) { if (accessOf(graph.nodes[all[i]]) !== 'emergency') { out.push(all[i]); } }
    return out.length ? out : all.slice(0);
  }

  function nearestNode(graph, floorId, x, y, accept) {
    var best = null;
    var bestD = Infinity;
    for (var id in graph.nodes) {
      if (!graph.nodes.hasOwnProperty(id)) { continue; }
      var n = graph.nodes[id];
      if (n.floorId !== floorId) { continue; }
      if (accept && !accept(n)) { continue; }
      var dx = num(n.x, 0) - x;
      var dy = num(n.y, 0) - y;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  }

  /* A building's entrance nodes a route may start or end at (emergency exits left out). */
  function entranceIds(graph, buildingId) {
    var out = [];
    for (var id in graph.nodes) {
      if (!graph.nodes.hasOwnProperty(id)) { continue; }
      var n = graph.nodes[id];
      var f = graph.floors[n.floorId];
      if (n.type === 'entrance' && f && f.buildingId === buildingId && accessOf(n) !== 'emergency') { out.push(id); }
    }
    return out;
  }

  function buildingOfNode(graph, nodeId) {
    var n = graph.nodes[nodeId];
    if (n && n.outdoor) { return n.buildingId || null; }
    var f = n ? graph.floors[n.floorId] : null;
    return f ? f.buildingId : null;
  }

  /* ---------------- v4: the outdoor graph joined at entrances ---------------- */

  /*
   * addOutdoorGraph(graph, outdoor) -> graph (mutated)
   *   outdoor = {nodes: [{id, lat, lng, type: 'path'|'entrance'|'crossing', access?, label?}],
   *              edges: [{id, from, to, distance (m), accessible, kind?, access?, way?}]}   (data/campus-map/outdoor-graph.json)
   * An outdoor node whose id is an indoor node (an entrance) is the same node: the indoor node gains lat/lng (a copy;
   * the campus data is not mutated) and the two graphs join there. Other outdoor nodes are added with outdoor: true.
   * Adds graph.outdoorEdges ([{id, from, to, a: [lng, lat], b, accessible, kind, distance, access}], for snapping a
   * position; access is the edge's own class, raised to its ends' class: an edge to an emergency door reads emergency)
   * and graph.entrances ({buildingId: [joined entrance ids, and the entrances drawn on the map for a building without
   * floor plans (outdoor nodes with buildingId)]}).
   */
  function addOutdoorGraph(graph, outdoor) {
    graph.outdoorEdges = [];
    graph.entrances = {};
    graph.hasOutdoor = false;
    var on = (outdoor && outdoor.nodes) || [];
    var i;
    for (i = 0; i < on.length; i++) {
      var o = on[i];
      if (!o || !o.id || !hasLngLat(o)) { continue; }
      var ex = graph.nodes[o.id];
      if (ex && !ex.outdoor) {
        var copy = {};
        for (var k in ex) { if (ex.hasOwnProperty(k)) { copy[k] = ex[k]; } }
        copy.lat = Number(o.lat);
        copy.lng = Number(o.lng);
        if (!copy.access && o.access) { copy.access = o.access; }
        if (!copy.label && o.label) { copy.label = o.label; }
        copy.joined = true;
        graph.nodes[o.id] = copy;
        var f = graph.floors[copy.floorId];
        var bid = f ? f.buildingId : null;
        if (bid) {
          if (!graph.entrances[bid]) { graph.entrances[bid] = []; }
          graph.entrances[bid].push(o.id);
        }
      } else if (!ex) {
        graph.nodes[o.id] = {
          id: o.id, lat: Number(o.lat), lng: Number(o.lng), type: o.type || 'path', outdoor: true,
          label: o.label || '', buildingId: o.buildingId || null, access: o.access
        };
        graph.adj[o.id] = [];
        /* an entrance drawn on the map for a building without floor plans (overrides.geojson layer entrances) */
        if (o.type === 'entrance' && o.buildingId) {
          if (!graph.entrances[o.buildingId]) { graph.entrances[o.buildingId] = []; }
          graph.entrances[o.buildingId].push(o.id);
        }
      }
    }
    /* v5: every joined entrance stays joined; findPath prices them by class (main, alt at the alt factor, emergency
       never walked). A sole door is an alt door the main doors cannot reach indoors (EP 1322 opens only to the outside,
       by ep-1-n0365): the automatic start falls back to it only when the main doors cannot reach the room indoors. */
    for (var bk in graph.entrances) {
      if (!graph.entrances.hasOwnProperty(bk)) { continue; }
      var list = graph.entrances[bk];
      var mains = [];
      var j;
      for (j = 0; j < list.length; j++) { if (accessOf(graph.nodes[list[j]]) === 'main') { mains.push(list[j]); } }
      if (!mains.length) { continue; }
      var inside = indoorReach(graph, mains);
      for (j = 0; j < list.length; j++) {
        var d = graph.nodes[list[j]];
        if (accessOf(d) === 'alt' && !d.outdoor && !inside[list[j]]) { d.soleDoor = true; }
      }
    }
    var oe = (outdoor && outdoor.edges) || [];
    for (i = 0; i < oe.length; i++) {
      var e = oe[i];
      if (!e) { continue; }
      var a = graph.nodes[e.from];
      var b = graph.nodes[e.to];
      if (!a || !b || a === b || !hasLngLat(a) || !hasLngLat(b)) { continue; }
      var d = num(e.distance, NaN);
      var cost = isFinite(d) && d > 0 ? d : Math.max(geoMeters(a, b), 0.01);
      var kind = e.kind || (toBool(e.steps, false) ? 'steps' : 'footway');
      var acc = toBool(e.accessible, true) && kind !== 'steps';
      var ea = accessOf(e);
      var ends = [ea, accessOf(a), accessOf(b)];
      var eff = ends.indexOf('emergency') > -1 ? 'emergency' : (ends.indexOf('alt') > -1 ? 'alt' : 'main');
      graph.adj[a.id].push({ to: b.id, cost: cost, accessible: acc, edgeId: e.id, outdoor: true, kind: kind, access: ea });
      graph.adj[b.id].push({ to: a.id, cost: cost, accessible: acc, edgeId: e.id, outdoor: true, kind: kind, access: ea });
      graph.outdoorEdges.push({ id: e.id, from: a.id, to: b.id, a: [Number(a.lng), Number(a.lat)], b: [Number(b.lng), Number(b.lat)],
        accessible: acc, kind: kind, distance: cost, access: eff, way: e.way || null });
    }
    graph.hasOutdoor = graph.outdoorEdges.length > 0;
    return graph;
  }

  /* Node ids reachable from the given nodes over the indoor edges a route may walk (main and alt; never emergency, as
     in findPath). Call before the outdoor edges are added. */
  function indoorReach(graph, fromIds) {
    var seen = {};
    var stack = fromIds.slice(0);
    for (var i = 0; i < stack.length; i++) { seen[stack[i]] = true; }
    while (stack.length) {
      var adj = graph.adj[stack.pop()] || [];
      for (var k = 0; k < adj.length; k++) {
        if (adj[k].outdoor || seen[adj[k].to]) { continue; }
        if (adj[k].access === 'emergency' || accessOf(graph.nodes[adj[k].to]) === 'emergency') { continue; }
        seen[adj[k].to] = true;
        stack.push(adj[k].to);
      }
    }
    return seen;
  }

  /* The doors a route starts or ends at for a building: its joined main entrances, else (none main, or allowAlt: the
     "Use side doors and paths" toggle) its joined main and alt entrances. Emergency doors never. A sole door is alt,
     so it is not offered here by default: it is used only when the goal lies behind it. */
  function mainEntrances(graph, buildingId, allowAlt) {
    var ids = (graph.entrances && graph.entrances[buildingId]) || [];
    var mains = [];
    var open = [];
    for (var i = 0; i < ids.length; i++) {
      var c = accessOf(graph.nodes[ids[i]]);
      if (c === 'main') { mains.push(ids[i]); }
      if (c !== 'emergency') { open.push(ids[i]); }
    }
    return mains.length && !allowAlt ? mains : open;
  }

  /*
   * snapEnds(route, start, goal) -> route   a route whose start or goal was snapped onto an outdoor edge (findPath
   * starts / goals with costs) drawn and counted from the snapped point itself.
   *   start / goal: {point: [lng, lat], edge?: an outdoor edge (its kind, accessible)} or null.
   * The partial edge becomes a link from a virtual outdoor node at the point to the route's first node (from its last
   * node to a point at the goal), of startCost (goalCost) meters. segmentRoute then counts those meters in the outdoor
   * walk, and when the edge ends at an entrance, the walk to that door and the door come before the indoor leg (a
   * visitor on the path is still outside). The virtual nodes are not graph nodes; route.links holds their edges.
   */
  var SNAP_START = '\u0000snap-start';
  var SNAP_GOAL = '\u0000snap-goal';

  function snapEnds(route, start, goal) {
    if (!route || !route.nodes || !route.nodes.length) { return route; }
    var nodes = route.nodes.slice(0);
    var ids = route.nodeIds.slice(0);
    var links = {};
    function point(id, p) { return { id: id, lng: Number(p[0]), lat: Number(p[1]), type: 'path', outdoor: true, snapped: true }; }
    function link(snap, cost) {
      var e = snap.edge || {};
      return { cost: cost, outdoor: true, kind: e.kind || 'footway', accessible: e.accessible !== false };
    }
    var sc = num(route.startCost, 0);
    if (start && start.point && (!nodes[0].outdoor || sc > 0.01)) {
      links[SNAP_START + '>' + nodes[0].id] = link(start, sc);
      nodes.unshift(point(SNAP_START, start.point));
      ids.unshift(SNAP_START);
    }
    var gc = num(route.goalCost, 0);
    var last = nodes[nodes.length - 1];
    if (goal && goal.point && (!last.outdoor || gc > 0.01)) {
      links[last.id + '>' + SNAP_GOAL] = link(goal, gc);
      nodes.push(point(SNAP_GOAL, goal.point));
      ids.push(SNAP_GOAL);
    }
    return { nodeIds: ids, nodes: nodes, distance: route.distance, startCost: sc, goalCost: gc, links: links };
  }

  /* The edge walked from a to b: a snapped end's link, else the cheapest graph edge. */
  function linkOf(graph, links, aId, bId) {
    if (links) {
      var l = links[aId + '>' + bId] || links[bId + '>' + aId];
      if (l) { return l; }
    }
    return stepEdge(graph, aId, bId);
  }

  /*
   * segmentRoute(graph, route) -> [segment]
   *   segment = { kind: 'outdoor'|'indoor', floorId (indoor), buildingId (indoor), nodes, distance, entry?, exit? }
   *   transitions: { type: 'door', node, buildingId, floorId }  between outdoor and indoor (the entrance node ends
   *   the outdoor walk and starts the indoor leg), or the v3 stair/elevator transition between floors (riding
   *   through several floors collapses into one).
   */
  function segmentRoute(graph, route) {
    if (!route || !route.nodes || !route.nodes.length) { return []; }
    var nodes = route.nodes;
    var segs = [];
    function bOf(n) { return buildingOfNode(graph, n.id); }
    function fresh(n, entry) {
      return n.outdoor
        ? { kind: 'outdoor', floorId: null, buildingId: null, nodes: [n], distance: 0, entry: entry || null }
        : { kind: 'indoor', floorId: n.floorId, buildingId: bOf(n), nodes: [n], distance: 0, entry: entry || null };
    }
    var cur = fresh(nodes[0]);
    for (var i = 1; i < nodes.length; i++) {
      var a = nodes[i - 1];
      var b = nodes[i];
      var e = linkOf(graph, route.links, a.id, b.id);
      var cost = e ? e.cost : 0;
      if (e && e.outdoor) {
        if (cur.kind === 'indoor') {
          var out = { type: 'door', node: a, buildingId: cur.buildingId, floorId: a.floorId };
          cur.exit = out;
          segs.push(cur);
          cur = { kind: 'outdoor', floorId: null, buildingId: null, nodes: [a], distance: 0, entry: out };
        }
        cur.nodes.push(b);
        cur.distance += cost;
        if (!b.outdoor) {
          var inn = { type: 'door', node: b, buildingId: bOf(b), floorId: b.floorId };
          cur.exit = inn;
          segs.push(cur);
          cur = fresh(b, inn);
        }
        continue;
      }
      if (a.floorId === b.floorId) {
        cur.nodes.push(b);
        cur.distance += cost;
        continue;
      }
      var type = (a.type === 'elevator' || b.type === 'elevator') ? 'elevator' : 'stair';
      var prev = segs.length ? segs[segs.length - 1] : null;
      if (prev && prev.exit && cur.nodes.length === 1 && cur.entry && cur.entry.type === type) {
        prev.exit.toFloorId = b.floorId;
        prev.exit.toNode = b;
        prev.exit.floors += 1;
        prev.exit.direction = floorLevel(graph, b.floorId) >= floorLevel(graph, prev.exit.fromFloorId) ? 'up' : 'down';
        cur = { kind: 'indoor', floorId: b.floorId, buildingId: bOf(b), nodes: [b], distance: 0, entry: prev.exit };
        continue;
      }
      var t = {
        type: type, fromFloorId: a.floorId, toFloorId: b.floorId,
        direction: floorLevel(graph, b.floorId) >= floorLevel(graph, a.floorId) ? 'up' : 'down',
        fromNode: a, toNode: b, floors: 1
      };
      cur.exit = t;
      segs.push(cur);
      cur = { kind: 'indoor', floorId: b.floorId, buildingId: bOf(b), nodes: [b], distance: 0, entry: t };
    }
    segs.push(cur);
    /* A path that only touches an entrance node (in by a door and straight out again) stays one outdoor walk. */
    var merged = [];
    for (var s = 0; s < segs.length; s++) {
      var sg = segs[s];
      var last = merged.length ? merged[merged.length - 1] : null;
      var next = segs[s + 1];
      if (sg.kind === 'indoor' && sg.nodes.length === 1 && sg.entry && sg.entry.type === 'door' && sg.exit && sg.exit.type === 'door' &&
          last && last.kind === 'outdoor' && next && next.kind === 'outdoor') {
        last.exit = null;
        for (var q = 1; q < next.nodes.length; q++) { last.nodes.push(next.nodes[q]); }
        last.distance += next.distance;
        last.exit = next.exit || null;
        s++;
        continue;
      }
      merged.push(sg);
    }
    if (route.links) { for (var m = 0; m < merged.length; m++) { merged[m].links = route.links; } }
    return merged;
  }

  function edgeKindsAlong(graph, nodes, links) {
    var kinds = {};
    for (var i = 1; i < nodes.length; i++) {
      var e = linkOf(graph, links, nodes[i - 1].id, nodes[i].id);
      if (e && e.kind) { kinds[e.kind] = true; }
    }
    return kinds;
  }

  /*
   * buildRouteSteps(graph, segments, names) -> [step]   one list for the whole route, door to room
   *   names.floorLabel(floorId) -> 'Second Floor'; names.destination -> 'IT 241'
   *   names.transitionName(node, type) -> optional proper name ('Stair 1')
   *   names.doorName(node, buildingId) -> 'east entrance' (default: the node label, else 'entrance'); an alt door is
   *   then called 'side door (east entrance)', an emergency door 'emergency exit (east entrance)'
   *   names.buildingName(buildingId) -> 'Collins Industry and Technology Center'
   *   step = { kind: 'outdoor'|'door'|'walk', view: 'map'|'indoor', title, detail, phrase, distance, nodeIds,
   *            floorId?, buildingId?, coords? [[lng, lat]] (outdoor, door), points? [[x, y]] (walk, door),
   *            exitType?, entryType? ('stair'|'elevator'|'door'), steps? (outdoor walk includes steps) }
   */
  function buildRouteSteps(graph, segments, names) {
    names = names || {};
    var floorLabel = names.floorLabel || function (id) { return id; };
    var dest = names.destination || 'your destination';
    var baseDoorName = names.doorName || function (n) { return (n && n.label) || 'entrance'; };
    function doorName(n, bid) {
      var nm = baseDoorName(n, bid);
      var c = accessOf(n);
      if (c === 'main') { return nm; }
      var what = c === 'alt' ? 'side door' : 'emergency exit';
      return nm && nm !== 'entrance' ? what + ' (' + nm + ')' : what;
    }
    var bName = names.buildingName || function (id) { return id || 'the building'; };
    var steps = [];
    function idsOf(s) { var out = []; for (var k = 0; k < s.nodes.length; k++) { if (!s.nodes[k].snapped) { out.push(s.nodes[k].id); } } return out; }
    function xy(s) { var out = []; for (var k = 0; k < s.nodes.length; k++) { if (!s.nodes[k].outdoor) { out.push([num(s.nodes[k].x, 0), num(s.nodes[k].y, 0)]); } } return out; }
    function ll(list) { var out = []; for (var k = 0; k < list.length; k++) { if (hasLngLat(list[k])) { out.push([Number(list[k].lng), Number(list[k].lat)]); } } return out; }
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      var walk = formatMeters(s.distance);
      if (s.kind === 'outdoor') {
        var kinds = edgeKindsAlong(graph, s.nodes, s.links);
        var door = s.exit && s.exit.type === 'door' ? s.exit : null;
        var dn = door ? doorName(door.node, door.buildingId) : '';
        var detail = s.distance > 0.5 ? 'Walk ' + walk + ' along the path' + (kinds.steps ? ', including steps' : '') + ' (about ' +
          formatMinutes(s.distance) + ').' : (door ? 'You are at the ' + dn + '.' : 'You are at the path.');
        steps.push({
          kind: 'outdoor', view: 'map', floorId: null, buildingId: door ? door.buildingId : null,
          title: door ? 'Walk to the ' + dn + ' of ' + bName(door.buildingId) : 'Arrive at ' + dest,
          detail: detail, phrase: door ? 'walk ' + walk + ' along the path' : 'walk ' + walk + ' along the path to ' + dest,
          distance: s.distance, nodeIds: idsOf(s), coords: ll(s.nodes), steps: !!kinds.steps,
          exitType: door ? 'door' : null, entryType: s.entry ? s.entry.type : null
        });
        if (door) {
          var dnode = door.node;
          steps.push({
            kind: 'door', view: 'indoor', floorId: door.floorId, buildingId: door.buildingId,
            title: 'Enter by the ' + dn, detail: bName(door.buildingId) + ', ' + floorLabel(door.floorId) + '. The floor plan takes over from here.',
            phrase: 'enter by the ' + dn, distance: 0, nodeIds: [dnode.id], nodeId: dnode.id,
            coords: ll([dnode]), points: [[num(dnode.x, 0), num(dnode.y, 0)]]
          });
        }
        continue;
      }
      var title;
      var det;
      var phrase;
      if (s.exit && s.exit.type === 'door') {
        var en = doorName(s.exit.node, s.buildingId);
        title = 'Leave by the ' + en;
        det = s.distance > 0.5 ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + ' to the ' + en + '.' : 'Start at the ' + en + '.';
        phrase = 'leave by the ' + en;
      } else if (s.exit) {
        var t = s.exit;
        var proper = names.transitionName ? names.transitionName(t.fromNode, t.type) : '';
        var thing = proper || (t.type === 'elevator' ? 'the elevator' : 'the stairs');
        title = 'Take ' + thing + ' ' + t.direction + ' to ' + floorLabel(t.toFloorId);
        det = s.distance > 0.5 ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + ' to ' + thing + '.' : 'Start at ' + thing + ' on ' + floorLabel(s.floorId) + '.';
        phrase = 'take ' + thing + ' ' + t.direction + ' to ' + floorLabel(t.toFloorId);
      } else {
        title = 'Arrive at ' + dest;
        det = s.distance > 0.5 ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + '.' : 'You are there.';
        phrase = 'arrive at ' + dest;
      }
      steps.push({
        kind: 'walk', view: 'indoor', floorId: s.floorId, buildingId: s.buildingId, title: title, detail: det, phrase: phrase,
        distance: s.distance, nodeIds: idsOf(s), points: xy(s),
        exitType: s.exit ? s.exit.type : null, entryType: s.entry ? s.entry.type : null
      });
    }
    for (var j = 0; j < steps.length; j++) { steps[j].index = j; }
    return steps;
  }

  /* "Walk 120 m along the path to the east entrance, enter by the east entrance, take the stairs up to Second Floor, arrive at IT 241." */
  function routeSentence(steps) {
    var parts = [];
    for (var i = 0; i < steps.length; i++) { if (steps[i].phrase) { parts.push(steps[i].phrase); } }
    if (!parts.length) { return ''; }
    var s = parts.join(', ') + '.';
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  return {
    toBool: toBool,
    num: num,
    accessOf: accessOf,
    DEFAULT_ALT_FACTOR: DEFAULT_ALT_FACTOR,
    DEFAULTS: DEFAULTS,
    MinHeap: MinHeap,
    buildGraph: buildGraph,
    addOutdoorGraph: addOutdoorGraph,
    mainEntrances: mainEntrances,
    hasLngLat: hasLngLat,
    geoMeters: geoMeters,
    findPath: findPath,
    routeConfusion: routeConfusion,
    isSideDoor: isSideDoor,
    nearestOpenNode: nearestOpenNode,
    segmentPath: segmentPath,
    snapEnds: snapEnds,
    segmentRoute: segmentRoute,
    buildSteps: buildSteps,
    buildRouteSteps: buildRouteSteps,
    routeSentence: routeSentence,
    nodesForRoom: nodesForRoom,
    nearestNode: nearestNode,
    entranceIds: entranceIds,
    buildingOfNode: buildingOfNode,
    isTransitionType: isTransitionType,
    formatMeters: formatMeters,
    formatMinutes: formatMinutes
  };
})();
</script>
