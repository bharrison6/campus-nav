<script>
/*
 * MSCNPath: indoor routing over NavNodes / NavEdges (Data contract v2).
 * Pure ES5, no DOM access: the same file is loaded by the web app (as an include)
 * and by the Node unit tests (tests/unit), which strip the <script> tags.
 *
 * Costs are meters (NavEdges.distance). Edges are walkable both ways.
 * Cross-floor edges join stair/elevator nodes; "accessible" false marks stairs.
 */
var MSCNPath = (function () {
  'use strict';

  var DEFAULT_MPP = 0.0254;
  var WALK_SPEED_MPS = 1.3;

  function toBool(v, dflt) {
    if (v === true || v === false) { return v; }
    if (v === null || v === undefined || v === '') { return dflt; }
    if (typeof v === 'number') { return v !== 0; }
    var s = String(v).replace(/^\s+|\s+$/g, '').toLowerCase();
    if (s === 'true' || s === 'yes' || s === 'y' || s === '1') { return true; }
    if (s === 'false' || s === 'no' || s === 'n' || s === '0') { return false; }
    return dflt;
  }

  function num(v, dflt) {
    if (v === null || v === undefined || v === '') { return dflt; }
    var n = Number(v);
    return isFinite(n) ? n : dflt;
  }

  /* Binary min-heap of {id, pri}. */
  function MinHeap() { this.a = []; }
  MinHeap.prototype.size = function () { return this.a.length; };
  MinHeap.prototype.push = function (id, pri) {
    var a = this.a;
    a.push({ id: id, pri: pri });
    var i = a.length - 1;
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (a[p].pri <= a[i].pri) { break; }
      var t = a[p]; a[p] = a[i]; a[i] = t;
      i = p;
    }
  };
  MinHeap.prototype.pop = function () {
    var a = this.a;
    var top = a[0];
    var last = a.pop();
    if (a.length > 0) {
      a[0] = last;
      var i = 0;
      var n = a.length;
      while (true) {
        var l = 2 * i + 1;
        var r = l + 1;
        var m = i;
        if (l < n && a[l].pri < a[m].pri) { m = l; }
        if (r < n && a[r].pri < a[m].pri) { m = r; }
        if (m === i) { break; }
        var t = a[m]; a[m] = a[i]; a[i] = t;
        i = m;
      }
    }
    return top;
  };

  function floorMpp(floors, floorId) {
    var f = floors[floorId];
    var m = f ? num(f.metersPerPixel, 0) : 0;
    return m > 0 ? m : DEFAULT_MPP;
  }

  function planarMeters(floors, a, b) {
    var dx = num(a.x, 0) - num(b.x, 0);
    var dy = num(a.y, 0) - num(b.y, 0);
    return Math.sqrt(dx * dx + dy * dy) * floorMpp(floors, a.floorId);
  }

  function isTransitionType(t) { return t === 'stair' || t === 'elevator'; }

  function edgeCost(edge, a, b, floors) {
    var d = num(edge.distance, NaN);
    if (isFinite(d) && d > 0) { return d; }
    if (a.floorId === b.floorId) { return Math.max(planarMeters(floors, a, b), 0.01); }
    return (a.type === 'elevator' || b.type === 'elevator') ? 12 : 8;
  }

  /* accessible column wins when present; otherwise a cross-floor stair edge is not accessible. */
  function edgeAccessible(edge, a, b) {
    var v = toBool(edge.accessible, null);
    if (v !== null) { return v; }
    if (a.floorId !== b.floorId && (a.type === 'stair' || b.type === 'stair')) { return false; }
    return true;
  }

  /*
   * buildGraph(data, opts)
   *   data: { floors, navNodes, navEdges }
   *   opts.floorFilter(floor, floorId) -> bool : drop nodes on floors that fail (hidden floors)
   */
  function buildGraph(data, opts) {
    opts = opts || {};
    var floors = {};
    var nodes = {};
    var adj = {};
    var byRoom = {};
    var i;
    var fl = (data && data.floors) || [];
    for (i = 0; i < fl.length; i++) { if (fl[i] && fl[i].id) { floors[fl[i].id] = fl[i]; } }

    var nn = (data && data.navNodes) || [];
    for (i = 0; i < nn.length; i++) {
      var n = nn[i];
      if (!n || !n.id) { continue; }
      if (opts.floorFilter && !opts.floorFilter(floors[n.floorId], n.floorId)) { continue; }
      nodes[n.id] = n;
      adj[n.id] = [];
      if (n.roomId) {
        if (!byRoom[n.roomId]) { byRoom[n.roomId] = []; }
        byRoom[n.roomId].push(n.id);
      }
    }

    var ee = (data && data.navEdges) || [];
    for (i = 0; i < ee.length; i++) {
      var e = ee[i];
      if (!e) { continue; }
      var a = nodes[e.fromNodeId];
      var b = nodes[e.toNodeId];
      if (!a || !b || a === b) { continue; }
      var cost = edgeCost(e, a, b, floors);
      var acc = edgeAccessible(e, a, b);
      adj[a.id].push({ to: b.id, cost: cost, accessible: acc, edgeId: e.id });
      adj[b.id].push({ to: a.id, cost: cost, accessible: acc, edgeId: e.id });
    }

    /* Room nodes first, then doors, then anything else tied to the room. */
    var rank = { room: 0, door: 1 };
    for (var rid in byRoom) {
      if (byRoom.hasOwnProperty(rid)) {
        byRoom[rid].sort(function (x, y) {
          var rx = rank.hasOwnProperty(nodes[x].type) ? rank[nodes[x].type] : 2;
          var ry = rank.hasOwnProperty(nodes[y].type) ? rank[nodes[y].type] : 2;
          return rx - ry;
        });
      }
    }

    return { nodes: nodes, adj: adj, floors: floors, byRoom: byRoom };
  }

  function toIdList(graph, ids) {
    var list = Object.prototype.toString.call(ids) === '[object Array]' ? ids : [ids];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && graph.nodes[list[i]] && out.indexOf(list[i]) === -1) { out.push(list[i]); }
    }
    return out;
  }

  /*
   * findPath(graph, startIds, goalIds, opts) -> route | null
   *   startIds / goalIds: a node id or an array of them (multi-source / multi-goal).
   *   opts.accessibleOnly: skip edges with accessible === false.
   *   route = { nodeIds, nodes, distance }
   */
  function findPath(graph, startIds, goalIds, opts) {
    opts = opts || {};
    var starts = toIdList(graph, startIds);
    var goals = toIdList(graph, goalIds);
    if (!starts.length || !goals.length) { return null; }

    var goalSet = {};
    var i;
    for (i = 0; i < goals.length; i++) { goalSet[goals[i]] = true; }
    var single = goals.length === 1 ? graph.nodes[goals[0]] : null;

    function h(id) {
      if (!single) { return 0; }
      var n = graph.nodes[id];
      if (n.floorId !== single.floorId) { return 0; }
      return planarMeters(graph.floors, n, single);
    }

    var g = {};
    var came = {};
    var closed = {};
    var heap = new MinHeap();
    for (i = 0; i < starts.length; i++) {
      g[starts[i]] = 0;
      heap.push(starts[i], h(starts[i]));
    }

    while (heap.size() > 0) {
      var cur = heap.pop().id;
      if (closed[cur]) { continue; }
      closed[cur] = true;
      if (goalSet[cur]) {
        var ids = [cur];
        var k = cur;
        while (came.hasOwnProperty(k)) { k = came[k]; ids.unshift(k); }
        var nodes = [];
        for (i = 0; i < ids.length; i++) { nodes.push(graph.nodes[ids[i]]); }
        return { nodeIds: ids, nodes: nodes, distance: g[cur] };
      }
      var nbrs = graph.adj[cur] || [];
      for (i = 0; i < nbrs.length; i++) {
        var nb = nbrs[i];
        if (opts.accessibleOnly && !nb.accessible) { continue; }
        if (closed[nb.to]) { continue; }
        var ng = g[cur] + nb.cost;
        if (!g.hasOwnProperty(nb.to) || ng < g[nb.to]) {
          g[nb.to] = ng;
          came[nb.to] = cur;
          heap.push(nb.to, ng + h(nb.to));
        }
      }
    }
    return null;
  }

  function stepCost(graph, aId, bId) {
    var nbrs = graph.adj[aId] || [];
    var best = Infinity;
    for (var i = 0; i < nbrs.length; i++) {
      if (nbrs[i].to === bId && nbrs[i].cost < best) { best = nbrs[i].cost; }
    }
    return best === Infinity ? 0 : best;
  }

  function floorLevel(graph, floorId) {
    var f = graph.floors[floorId];
    return f ? num(f.level, 0) : 0;
  }

  /*
   * segmentPath(graph, route) -> [segment]
   *   segment = { floorId, nodes, distance, exit?: transition, entry?: transition }
   *   transition = { type: 'stair'|'elevator', fromFloorId, toFloorId, direction: 'up'|'down',
   *                  fromNode, toNode, floors: number of floors travelled }
   * Riding a stair or elevator through several floors collapses into one transition.
   */
  function segmentPath(graph, route) {
    if (!route || !route.nodes || !route.nodes.length) { return []; }
    var nodes = route.nodes;
    var segments = [];
    var cur = { floorId: nodes[0].floorId, nodes: [nodes[0]], distance: 0 };
    for (var i = 1; i < nodes.length; i++) {
      var a = nodes[i - 1];
      var b = nodes[i];
      if (a.floorId === b.floorId) {
        cur.nodes.push(b);
        cur.distance += stepCost(graph, a.id, b.id);
        continue;
      }
      var type = (a.type === 'elevator' || b.type === 'elevator') ? 'elevator' : 'stair';
      var prev = segments.length ? segments[segments.length - 1] : null;
      if (prev && cur.nodes.length === 1 && cur.entry && cur.entry.type === type) {
        /* Pass-through floor: extend the previous transition. */
        prev.exit.toFloorId = b.floorId;
        prev.exit.toNode = b;
        prev.exit.floors += 1;
        prev.exit.direction = floorLevel(graph, b.floorId) >= floorLevel(graph, prev.exit.fromFloorId) ? 'up' : 'down';
        cur = { floorId: b.floorId, nodes: [b], distance: 0, entry: prev.exit };
        continue;
      }
      var t = {
        type: type,
        fromFloorId: a.floorId,
        toFloorId: b.floorId,
        direction: floorLevel(graph, b.floorId) >= floorLevel(graph, a.floorId) ? 'up' : 'down',
        fromNode: a,
        toNode: b,
        floors: 1
      };
      cur.exit = t;
      segments.push(cur);
      cur = { floorId: b.floorId, nodes: [b], distance: 0, entry: t };
    }
    segments.push(cur);
    return segments;
  }

  function formatMeters(m) {
    if (!isFinite(m) || m <= 0) { return '0 m'; }
    if (m < 10) { return Math.round(m) + ' m'; }
    return (Math.round(m / 5) * 5) + ' m';
  }

  function formatMinutes(m) {
    var mins = Math.max(1, Math.round(m / WALK_SPEED_MPS / 60));
    return mins + ' min';
  }

  /*
   * buildSteps(graph, segments, names) -> [step]
   *   names.floorLabel(floorId) -> 'Floor 2'
   *   names.destination -> 'IT 241'
   *   names.transitionName(node, type) -> optional proper name ('Stair 1')
   *   step = { kind: 'walk', index, floorId, title, detail, distance, nodeIds }
   */
  function buildSteps(graph, segments, names) {
    names = names || {};
    var floorLabel = names.floorLabel || function (id) { return id; };
    var dest = names.destination || 'your destination';
    var steps = [];
    for (var i = 0; i < segments.length; i++) {
      var s = segments[i];
      var ids = [];
      for (var k = 0; k < s.nodes.length; k++) { ids.push(s.nodes[k].id); }
      var walk = formatMeters(s.distance);
      var title;
      var detail;
      if (s.exit) {
        var t = s.exit;
        var proper = names.transitionName ? names.transitionName(t.fromNode, t.type) : '';
        var thing = proper || (t.type === 'elevator' ? 'the elevator' : 'the stairs');
        title = 'Take ' + thing + ' ' + t.direction + ' to ' + floorLabel(t.toFloorId);
        detail = s.distance > 0.5
          ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + ' to ' + thing + '.'
          : 'Start at ' + thing + ' on ' + floorLabel(s.floorId) + '.';
      } else {
        title = 'Arrive at ' + dest;
        detail = s.distance > 0.5
          ? 'Walk ' + walk + ' on ' + floorLabel(s.floorId) + '.'
          : 'You are there.';
      }
      steps.push({
        kind: 'walk', index: i, floorId: s.floorId, title: title, detail: detail,
        distance: s.distance, nodeIds: ids
      });
    }
    return steps;
  }

  /* Nodes that stand for a room (room node, then door nodes). */
  function nodesForRoom(graph, roomId) {
    return (graph.byRoom[roomId] || []).slice(0);
  }

  function nearestNode(graph, floorId, x, y, accept) {
    var best = null;
    var bestD = Infinity;
    for (var id in graph.nodes) {
      if (!graph.nodes.hasOwnProperty(id)) { continue; }
      var n = graph.nodes[id];
      if (n.floorId !== floorId) { continue; }
      if (accept && !accept(n)) { continue; }
      var dx = num(n.x, 0) - x;
      var dy = num(n.y, 0) - y;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  }

  function entranceIds(graph, buildingId) {
    var out = [];
    for (var id in graph.nodes) {
      if (!graph.nodes.hasOwnProperty(id)) { continue; }
      var n = graph.nodes[id];
      var f = graph.floors[n.floorId];
      if (n.type === 'entrance' && f && f.buildingId === buildingId) { out.push(id); }
    }
    return out;
  }

  function buildingOfNode(graph, nodeId) {
    var n = graph.nodes[nodeId];
    var f = n ? graph.floors[n.floorId] : null;
    return f ? f.buildingId : null;
  }

  return {
    toBool: toBool,
    num: num,
    MinHeap: MinHeap,
    buildGraph: buildGraph,
    findPath: findPath,
    segmentPath: segmentPath,
    buildSteps: buildSteps,
    nodesForRoom: nodesForRoom,
    nearestNode: nearestNode,
    entranceIds: entranceIds,
    buildingOfNode: buildingOfNode,
    isTransitionType: isTransitionType,
    formatMeters: formatMeters,
    formatMinutes: formatMinutes
  };
})();
</script>
